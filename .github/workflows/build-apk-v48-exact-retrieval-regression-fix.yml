      - name: Preserve complete garden notes and handle correction intent (Nara Step 2O)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/assets/index.html')
          source = path.read_text(encoding='utf-8')
          original = source

          # Replace complete function bodies once after all previous transformations, so the
          # latest fallback intent wins while all cross-plant audit guards remain untouched.
          def replace_function(name: str, replacement: str) -> None:
              global source
              pattern = rf'function {re.escape(name)}\([^\n]*\)\{{[\s\S]*?\n\}}'
              matches = list(re.finditer(pattern, source))
              if len(matches) != 1:
                  raise SystemExit(f'ERROR: Step 2O expected exactly one {name} function, found {len(matches)}.')
              source = source[:matches[0].start()] + replacement + source[matches[0].end():]

          evidence_helper = r'''function naraClipEvidenceText(value,maxLength=620){
            const text=String(value||'').replace(/\s+/g,' ').trim();
            const max=Math.max(80,Number(maxLength)||620);
            if(text.length<=max)return text;
            const head=text.slice(0,max);
            const sentenceEnd=Math.max(head.lastIndexOf('. '),head.lastIndexOf('! '),head.lastIndexOf('? '));
            if(sentenceEnd>=Math.floor(max*0.55))return head.slice(0,sentenceEnd+1).trim()+' [catatan dipersingkat setelah batas kalimat]';
            const wordEnd=head.lastIndexOf(' ');
            return head.slice(0,wordEnd>0?wordEnd:head.length).trimEnd()+'… [catatan dipersingkat]';
          }
          function naraEvidenceTargetPlants(question,primaryCrop){
            const raw=String(question||'');
            const crop=String(primaryCrop||'').toLocaleLowerCase('id-ID').trim();
            const tokens=typeof naraMemoryTokens==='function'?naraMemoryTokens(crop):crop.split(/\s+/).filter(Boolean);
            const matchesCrop=p=>{
              const name=String(p?.name||'');
              const nameTokens=typeof naraMemoryTokens==='function'?naraMemoryTokens(name):name.toLocaleLowerCase('id-ID').split(/\s+/);
              return !!crop&&tokens.some(t=>t.length>=3&&nameTokens.includes(t));
            };
            const named=typeof naraPlantEntriesMentionedInText==='function'?naraPlantEntriesMentionedInText(raw):[];
            const focused=named.filter(matchesCrop);
            if(focused.length)return [...new Map(focused.map(p=>[String(p.id||p.name),p])).values()];
            return (Array.isArray(data)?data:[]).filter(matchesCrop).slice(0,5);
          }
          function naraBuildEvidenceInventoryFallback(question,primaryCrop){
            const raw=String(question||'');
            const crop=String(primaryCrop||'tanaman yang disebutkan').trim();
            const targetPlants=naraEvidenceTargetPlants(raw,crop);
            const targetIds=new Set(targetPlants.map(p=>String(p.id||p.name)));
            const textHasCrop=value=>{
              const hay=typeof naraMemoryTokens==='function'?naraMemoryTokens(String(value||'')):String(value||'').toLocaleLowerCase('id-ID').split(/[^a-z0-9]+/).filter(Boolean);
              const need=typeof naraMemoryTokens==='function'?naraMemoryTokens(crop):crop.toLocaleLowerCase('id-ID').split(/[^a-z0-9]+/).filter(Boolean);
              return need.some(t=>t.length>=3&&hay.includes(t));
            };
            const samePlantRecord=r=>{
              const id=r?.plantId;
              if(id!==undefined&&id!==null&&String(id)!=='')return targetIds.has(String(id));
              return textHasCrop(r?.plantName||r?.plant||'');
            };
            const direct=[],contextual=[];
            const eventsFor=p=>typeof naraPlantEvents==='function'?naraPlantEvents(p):(Array.isArray(p?.events)?p.events:[]);
            for(const p of targetPlants){
              const name=String(p.name||crop);
              const note=naraClipEvidenceText(p.note,620);
              if(note){
                if(/menguning|kuning|layu|bercak|gejala|hama|penyakit|akar busuk|kutu putih|semut merah/i.test(note))direct.push(`${name} — catatan profil tanaman: ${note}`);
                else contextual.push(`${name} — catatan profil tanaman: ${note}`);
              }
              if(p.lastWater)contextual.push(`${name} — penyiraman terakhir tercatat: ${naraClipEvidenceText(p.lastWater,180)}${p.lastWaterSource?` (sumber: ${naraClipEvidenceText(p.lastWaterSource,80)})`:''}`);
              for(const e of eventsFor(p).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,4)){
                const desc=naraClipEvidenceText([e.label||e.type,e.note].filter(Boolean).join(': '),620);
                if(!desc)continue;
                const row=`${name} — ${e.date||'tanggal tidak tercatat'}: ${desc}`;
                if(/menguning|kuning|layu|bercak|gejala|hama|penyakit|busuk|kutu putih|semut merah/i.test(desc))direct.push(row);
                else contextual.push(row);
              }
            }
            const attentionRows=(Array.isArray(attentions)?attentions:[]).filter(a=>targetIds.has(String(a.plantId))).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5);
            for(const a of attentionRows){
              const name=String(targetPlants.find(p=>String(p.id||p.name)===String(a.plantId))?.name||crop);
              const desc=[a.problemType||a.type,a.affectedPart,a.note?naraClipEvidenceText(a.note,720):'',a.action?naraClipEvidenceText(a.action,420):''].filter(Boolean).join('; ');
              if(desc)direct.push(`${name} — catatan Perlu Perhatian (${a.date||'tanggal tidak tercatat'}, rekaman tertaut melalui plantId): ${desc}`);
            }
            const harvestRows=(Array.isArray(harvests)?harvests:[]).filter(samePlantRecord).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5);
            for(const h of harvestRows){
              contextual.push(`${h.plantName||targetPlants.find(p=>String(p.id||p.name)===String(h.plantId))?.name||crop} — Panen ${h.date||'tanggal tidak tercatat'}: ${h.qty??'jumlah tidak tercatat'} ${h.unit||''}; kualitas ${h.quality||'tidak tercatat'}${h.note?`; catatan: ${naraClipEvidenceText(h.note,420)}`:''}`);
            }
            const noteRows=(Array.isArray(gardenNotes)?gardenNotes:[]).filter(n=>{
              const content=[n.title,n.text,n.note,n.content].filter(Boolean).join(' ');
              const found=typeof naraPlantEntriesMentionedInText==='function'?naraPlantEntriesMentionedInText(content):[];
              if(found.length)return found.some(p=>targetIds.has(String(p.id||p.name)))&&found.every(p=>targetIds.has(String(p.id||p.name)));
              return textHasCrop(content);
            }).slice(-4);
            for(const n of noteRows){
              const content=naraClipEvidenceText([n.title,n.text||n.note||n.content].filter(Boolean).join(': '),620);
              if(content)contextual.push(`${n.date||n.createdAt||'tanggal tidak tercatat'} — catatan kebun yang menyebut ${crop}: ${content}`);
            }
            const lines=[`Audit bukti untuk ${targetPlants.map(p=>p.name).join(', ')||crop}:`,'Batas metode: hanya rekaman lokal yang dapat dicocokkan dengan fokus tanaman yang dimasukkan di bawah ini. Keterkaitan ID membuktikan tautan di aplikasi, bukan verifikasi independen bahwa observasi benar atau penyebabnya sudah terbukti.','','1. Bukti langsung/observasi yang tercatat:'];
            lines.push(...([...new Set(direct)].slice(0,7).map(x=>`- ${x}`)));
            if(!direct.length)lines.push('- Tidak ditemukan observasi gejala yang cocok pada rekaman lokal yang dapat ditautkan ke tanaman sasaran.');
            lines.push('','2. Konteks tidak langsung:');
            lines.push(...([...new Set(contextual)].slice(0,8).map(x=>`- ${x}`)));
            if(!contextual.length)lines.push('- Tidak ditemukan catatan konteks tambahan yang cocok.');
            lines.push('','3. Hal yang belum bisa disimpulkan:','- Riwayat panen tidak membuktikan penyebab daun menguning atau kesehatan tanaman saat ini.','- Catatan hama/kejadian menunjukkan apa yang tercatat, tetapi tidak sendirinya membuktikan hubungan sebab-akibat.','- Jika kategori tidak muncul, itu berarti tidak ditemukan pada rekaman lokal yang cocok dalam pemeriksaan ini; bukan bukti bahwa peristiwa tidak pernah terjadi.');
            return lines.join('\n');
          }
          function naraBuildCorrectionAuditFallback(question,primaryCrop){
            const raw=String(question||'');
            const asksCorrection=/(audit ulang|audit terakhirmu|koreksi|perbaiki|hitung ulang|perhitungan|selisih waktu|selisih hari|tanggal acuan|umur tanaman)/i.test(raw)&&/(tanggal|hari|umur|tanaman|perhitungan|klaim|catatan|bukti|hama|panen|19\s+juli|12\s+oktober)/i.test(raw);
            if(!asksCorrection)return '';
            const monthMap={januari:0,februari:1,maret:2,april:3,mei:4,juni:5,juli:6,agustus:7,september:8,oktober:9,november:10,desember:11};
            const months=Object.keys(monthMap).join('|');
            const datePattern=new RegExp('\\b(\\d{1,2})\\s+('+months+')(?:\\s+(\\d{4}))?\\b','gi');
            const rawDates=[];let match;
            while((match=datePattern.exec(raw))!==null){
              const year=match[3]?Number(match[3]):null;
              rawDates.push({day:Number(match[1]),month:monthMap[String(match[2]).toLocaleLowerCase('id-ID')],year,raw:match[0],index:match.index});
            }
            const explicitYear=(raw.match(/\b20\d{2}\b/)||[])[0];
            const fallbackYear=explicitYear?Number(explicitYear):new Date().getFullYear();
            for(const d of rawDates)if(!d.year)d.year=fallbackYear;
            const dates=[];const seen=new Set();
            for(const d of rawDates){const key=`${d.year}-${d.month}-${d.day}`;if(!seen.has(key)){seen.add(key);dates.push(d);}}
            let dateAudit='Tanggal acuan atau tanggal penanaman tidak dapat dihitung dengan aman dari pertanyaan ini karena dua tanggal yang tidak ambigu tidak ditemukan.';
            if(dates.length>=2){
              const start=dates[0],end=dates[1];
              const startMs=Date.UTC(start.year,start.month,start.day),endMs=Date.UTC(end.year,end.month,end.day);
              const elapsed=Math.round((endMs-startMs)/86400000);
              const fmt=d=>`${d.day} ${Object.keys(monthMap).find(k=>monthMap[k]===d.month)} ${d.year}`;
              if(elapsed>=0&&elapsed<=5000){
                dateAudit=`Dari ${fmt(start)} sampai ${fmt(end)} terdapat ${elapsed} hari berlalu. Jika tanggal penanaman dihitung sebagai hari pertama, hitungan inklusif menjadi ${elapsed+1} hari. Jadi, nyatakan metode secara eksplisit; untuk selisih waktu yang telah berlalu gunakan ${elapsed} hari, sedangkan hitungan inklusif adalah ${elapsed+1} hari.`;
              }else dateAudit=`Urutan tanggal ${fmt(start)} dan ${fmt(end)} perlu diperiksa karena tanggal akhir tampak lebih awal daripada tanggal awal.`;
            }
            const crops=typeof naraExplicitCropTerms==='function'?naraExplicitCropTerms(raw):[];
            const crop=String(primaryCrop||crops[0]||'tanaman yang disebutkan');
            const targetPlants=naraEvidenceTargetPlants(raw,crop);
            const targetIds=new Set(targetPlants.map(p=>String(p.id||p.name)));
            const rows=(Array.isArray(attentions)?attentions:[]).filter(a=>targetIds.has(String(a.plantId))).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5);
            const linked=rows.map(a=>{
              const name=targetPlants.find(p=>String(p.id||p.name)===String(a.plantId))?.name||crop;
              const details=[a.problemType||a.type,a.affectedPart,a.note?naraClipEvidenceText(a.note,720):'',a.action?naraClipEvidenceText(a.action,420):''].filter(Boolean).join('; ');
              return `- Rekaman Perlu Perhatian ${a.date||'tanpa tanggal'} ditautkan ke ${name} melalui plantId: ${details}. Ini memverifikasi tautan catatan di aplikasi, bukan bukti independen tentang kebenaran observasi atau penyebab daun menguning.`;
            });
            const harvestRows=(Array.isArray(harvests)?harvests:[]).filter(h=>{
              if(h?.plantId!==undefined&&h?.plantId!==null&&String(h.plantId)!=='')return targetIds.has(String(h.plantId));
              return targetPlants.some(p=>String(h?.plantName||'').toLowerCase().includes(String(p.name||crop).toLowerCase()));
            }).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,3);
            const harvest=harvestRows.map(h=>`- Panen ${h.date||'tanggal tidak tercatat'}: ${h.qty??'jumlah tidak tercatat'} ${h.unit||''}; kualitas ${h.quality||'tidak dicatat'}. Catatan ini tidak membuktikan penyebab gejala saat ini.`);
            return `Audit koreksi (jawaban cadangan berbasis catatan lokal):\n\n1. Perhitungan tanggal\n- ${dateAudit}\n\n2. Keterkaitan catatan hama/daun\n${linked.join('\n')||'- Tidak ditemukan catatan Perlu Perhatian yang dapat ditautkan melalui plantId ke tanaman sasaran. Jangan menyimpulkan kaitan dengan tanaman lain.'}\n\n3. Arti catatan panen\n${harvest.join('\n')||'- Tidak ditemukan riwayat panen yang dapat ditautkan melalui plantId ke tanaman sasaran.'}\n\n4. Batas kesimpulan\n- Catatan pengguna membuktikan bahwa informasi tersebut tercatat pada aplikasi; tidak otomatis memverifikasi secara independen apa yang terjadi di kebun.\n- Adanya catatan hama dan gejala pada tanaman yang sama membuat hama relevan untuk diperiksa, tetapi belum membuktikan penyebab daun menguning.\n- Jika observasi “Guardian League” muncul dalam catatan, istilah itu dipertahankan utuh sejauh batas tampilan memungkinkan; keberhasilan hewan pengendali perlu dinilai dari hasil observasi, bukan diasumsikan.`;
          }
          '''

          replace_function('naraPlantScopeSafeFallback', r'''function naraPlantScopeSafeFallback(question){
            const raw=String(question||'');
            const q=raw.toLocaleLowerCase('id-ID');
            const crops=typeof naraExplicitCropTerms==='function'?naraExplicitCropTerms(raw):[];
            const mentioned=typeof naraPlantEntriesMentionedInText==='function'?naraPlantEntriesMentionedInText(raw):[];
            const lowered=raw.toLocaleLowerCase('id-ID');
            const firstCrop=crops.map(term=>({term,index:lowered.indexOf(String(term).toLocaleLowerCase('id-ID'))})).filter(x=>x.index>=0).sort((a,b)=>a.index-b.index)[0]?.term||'';
            const primaryRecord=mentioned.filter(p=>firstCrop&&String(p.name||'').toLocaleLowerCase('id-ID').includes(String(firstCrop).toLocaleLowerCase('id-ID'))).filter(p=>lowered.indexOf(String(p.name||'').toLocaleLowerCase('id-ID'))>=0).sort((a,b)=>lowered.indexOf(String(a.name||'').toLocaleLowerCase('id-ID'))-lowered.indexOf(String(b.name||'').toLocaleLowerCase('id-ID')))[0];
            const crop=String(primaryRecord?.name||firstCrop||crops[0]||'tanaman yang kamu sebutkan');
            const correction=naraBuildCorrectionAuditFallback(raw,crop);
            if(correction)return correction;
            const asksEvidenceInventory=/(periksa|inventaris|daftar|audit|seluruh|semua|data apa|bukti apa|catatan apa|periksa kembali|berdasarkan data yang tersedia)/i.test(raw)&&/(catatan|riwayat|rekaman|bukti|data kebun|observasi|klaim|perhitungan)/i.test(raw);
            const asksHarvestRelevance=/(hasil panen|catatan panen|riwayat panen|panen)/i.test(raw)&&/(membantu|relevan|menentukan|penyebab|bukti|hubungan|berkaitan|gunakan|dipakai)/i.test(raw);
            if(asksEvidenceInventory)return naraBuildEvidenceInventoryFallback(raw,crop);
            if(asksHarvestRelevance){
              const cropList=crops.length>1?crops.join(' dan '):(crop||'tanaman yang disebutkan');
              return `Catatan panen ${cropList} dapat memberi konteks produksi dan waktu panen untuk tanaman yang benar-benar tertaut, tetapi jumlah, kualitas, atau tanggal panen saja tidak membuktikan penyebab daun menguning. Catatan panen tanaman lain tidak boleh dianggap sebagai bukti kondisi ${crop}. Untuk menyelidiki penyebabnya, cocokkan identitas tanaman dan tanggal, lalu periksa pola daun, kelembapan media, drainase, serta tanda hama atau penyakit. Penyebab utama belum dapat ditentukan hanya dari data panen.`;
            }
            if(/menguning|kuning|yellowing/i.test(q)){
              return `Untuk tanaman ${crop}, daun menguning dapat memiliki beberapa kemungkinan umum, misalnya masalah penyiraman atau drainase, ketersediaan hara, stres lingkungan, atau hama dan penyakit bila ada tanda pendukung. Dari gejala yang disebutkan saja, penyebab utama di kebunmu belum bisa dipastikan. Periksa apakah daun tua atau muda yang lebih dulu menguning, apakah perubahan merata atau berupa bercak, kelembapan media dan drainase, serta bagian bawah daun. Ini pemeriksaan awal, bukan klaim bahwa pemeriksaan sudah dilakukan. Jangan langsung menambah pupuk atau memakai pestisida tanpa bukti pendukung. Catatan tanaman lain tidak dipakai sebagai bukti untuk kasus ini.`;
            }
            if(/catatan|riwayat|bukti|relevan|membantu|menentukan|penyebab|hubungan/i.test(q)){
              return `Catatan hanya mendukung kesimpulan jika identitas tanaman, waktu, dan jenis pengamatan cocok. Catatan tanaman lain tidak menjadi bukti langsung untuk ${crop}, dan pengetahuan umum hanya membantu menyusun hipotesis. Dari informasi yang tersedia, hubungan sebab-akibat belum dapat dipastikan.`;
            }
            return `Aku belum dapat memberi kesimpulan spesifik berdasarkan konteks yang tersedia. Aku bisa memakai pengetahuan umum untuk menjelaskan kemungkinan, tetapi klaim tentang kebun harus didukung catatan atau observasi yang cocok dengan tanaman dan waktu yang dibahas. Aku tidak akan menganggap data tanaman lain sebagai bukti untuk ${crop}.`;
          }''')

          # Insert note/correction helper functions immediately before the replacement fallback.
          marker = 'function naraPlantScopeSafeFallback(question){'
          if source.count(marker) != 1:
              raise SystemExit('ERROR: Step 2O cannot locate the single fallback entry point after replacement.')
          source = source.replace(marker, evidence_helper + '\n' + marker, 1)

          checks={
            'complete note clipping is sentence/word aware': 'function naraClipEvidenceText(value,maxLength=620)' in source and '[catatan dipersingkat setelah batas kalimat]' in source,
            'inventory fallback scopes records to the primary plant': 'function naraEvidenceTargetPlants(question,primaryCrop)' in source and 'targetIds.has(String(a.plantId))' in source,
            'correction intent precedes evidence-inventory intent': source.index('const correction=naraBuildCorrectionAuditFallback(raw,crop);') < source.index('const asksEvidenceInventory='),
            'date arithmetic is elapsed-days and inclusive-days explicit': 'hari berlalu' in source and 'hitungan inklusif' in source,
            'Guardian League note text uses bounded sentence/word-aware clipping': 'naraClipEvidenceText(a.note,720)' in source and 'function naraClipEvidenceText(value,maxLength=620)' in source,
            'causality is not inferred from linked pest note': 'belum membuktikan penyebab daun menguning' in source,
            'candidate/validated memory remains present': 'naraState.teacherCandidateLessons' in source and 'naraState.teacherValidatedLessons' in source,
            'plant-scope audit remains present': 'function naraAuditAnswerPlantScope' in source,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('ERROR: Step 2O checks failed: '+', '.join(failed))
          if source==original: raise SystemExit('ERROR: Step 2O made no source changes.')
          path.write_text(source,encoding='utf-8')
          print('Step 2O note-preservation and correction-aware fallback applied.')
          for name in checks: print('PASS:',name)
          PYTHON

      - name: Regression-test full-note preservation and correction-aware fallback (Nara Step 2O)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          const html=fs.readFileSync('android/app/src/main/assets/index.html','utf8');
          function extractFunction(name){
            const start=html.indexOf(`function ${name}(`);
            if(start<0)throw new Error(`Missing function ${name}`);
            const next=html.indexOf('\nfunction ',start+1);
            return html.slice(start,next<0?html.length:next);
          }
          const code=['naraClipEvidenceText','naraEvidenceTargetPlants','naraBuildEvidenceInventoryFallback','naraBuildCorrectionAuditFallback','naraPlantScopeSafeFallback'].map(extractFunction).join('\n');
          const data=[
            {id:'tomato-1',name:'Tomat Cherry',note:'Tanaman tomat Cherry ditanam pada 19 Juli 2026.'},
            {id:'eggplant-1',name:'Terung Bulat Hijau',note:'Catatan terung tidak boleh dianggap sebagai fakta tomat.'}
          ];
          const guardianNote='Sekelompok Kutu Putih dibacking oleh Semut Merah sedang memakan daun tomat. Daun terlihat layu dan menggulung; diamati dulu 3 hari ini, apakah Guardian League berhasil mengendalikan hama tersebut?';
          const context={
            data,
            attentions:[
              {plantId:'tomato-1',date:'2026-10-12',type:'pest',affectedPart:'leaf',note:guardianNote},
              {plantId:'eggplant-1',date:'2026-10-12',type:'pest',affectedPart:'leaf',note:'RAHASIA_CATATAN_TERUNG'}
            ],
            harvests:[
              {plantId:'tomato-1',date:'2026-09-14',qty:8,unit:'buah',quality:'Baik'},
              {plantId:'eggplant-1',date:'2026-10-13',qty:19,unit:'buah',quality:'Baik'}
            ],
            gardenNotes:[],
            naraState:{messages:[]},
            naraMemoryTokens(value){return String(value||'').toLocaleLowerCase('id-ID').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);},
            naraExplicitCropTerms(value){const q=String(value||'').toLowerCase();const out=[];for(const term of ['tomat','terung','cabai'])if(q.includes(term))out.push(term);return out;},
            naraPlantEntriesMentionedInText(value){const q=String(value||'').toLowerCase();return data.filter(p=>q.includes(p.name.toLowerCase())||q.includes('tomat')&&p.name.startsWith('Tomat')||q.includes('terung')&&p.name.startsWith('Terung'));},
            naraPlantEvents(p){return p.events||[];},
            console
          };
          vm.createContext(context);vm.runInContext(code,context);
          const originalNote=context.naraClipEvidenceText(guardianNote,720);
          assert(originalNote.includes('Guardian League berhasil mengendalikan hama tersebut?'),'Long notes must preserve the complete Guardian League clause when below the limit.');
          const correction='Nara, audit ulang perhitungan umur tanaman tomat Cherry. Tanggal tanam 19 Juli sampai 12 Oktober 2026 adalah 85 hari berlalu. Koreksi tanggal penanaman, catatan hama, dan panen untuk tanaman tomat Cherry; jelaskan fakta dan sebab-akibat.';
          const correctionAnswer=context.naraPlantScopeSafeFallback(correction);
          assert(correctionAnswer.includes('85 hari berlalu'),'Correction fallback should calculate 19 July to 12 October 2026 as 85 elapsed days.');
          assert(correctionAnswer.includes('86 hari'),'Correction fallback should distinguish inclusive counting.');
          assert(correctionAnswer.includes('Guardian League berhasil mengendalikan hama tersebut?'),'Correction fallback should keep the full note and avoid mid-word truncation.');
          assert(correctionAnswer.includes('belum membuktikan penyebab daun menguning'),'Linkage of a pest note must not be stated as causal proof.');
          const inventory='Periksa seluruh catatan kebun yang relevan untuk tanaman Tomat Cherry. Data apa yang tersedia sebagai bukti langsung dan konteks tidak langsung? Jangan gunakan catatan terung sebagai bukti tomat.';
          const inventoryAnswer=context.naraPlantScopeSafeFallback(inventory);
          assert(inventoryAnswer.includes('Audit bukti untuk Tomat Cherry'),'Inventory intent should return a scoped inventory.');
          assert(inventoryAnswer.includes('Guardian League berhasil mengendalikan hama tersebut?'),'Evidence inventory must preserve the complete note text within the safe limit.');
          assert(!inventoryAnswer.includes('RAHASIA_CATATAN_TERUNG'),'The other plant record must not leak into the tomato inventory.');
          assert(inventoryAnswer.includes('Panen 2026-09-14'),'The tomato harvest record should be identified as indirect context.');
          const simple='Daun tomat menguning. Apa kemungkinan penyebabnya?';
          const simpleAnswer=context.naraPlantScopeSafeFallback(simple);
          assert(simpleAnswer.includes('beberapa kemungkinan umum'),'Simple symptom questions must retain the safe general fallback.');
          console.log('PASS: Guardian League record text is preserved within configured safe limit');
          console.log('PASS: correction intent takes precedence over generic evidence inventory');
          console.log('PASS: elapsed-days and inclusive-days are distinguished');
          console.log('PASS: linked pest notes are not presented as causal proof');
          console.log('PASS: evidence inventory remains restricted to the primary plant');
          console.log('PASS: general yellowing fallback remains available');
          NODE

      - name: Add Nara retrieval diagnostics (Nara Step 2P)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path('android/app/src/main/assets/index.html')
          source = path.read_text(encoding='utf-8')
          original = source

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: Step 2P stopped at {label}: expected one exact anchor, found {count}. Refusing an ambiguous patch.')
              source = source.replace(old, new, 1)

          # Add a read-only diagnostic panel below the persistent user-knowledge list.
          panel_anchor = '    <div class="nara-boundary">'
          panel = r'''    <details class="nara-knowledge" id="naraRetrievalDiagnosticPanel">
            <summary>🧪 Diagnostik Retrieval Pengetahuan</summary>
            <div class="nara-knowledge-intro">Pemeriksaan baca-saja untuk menguji tiga hal: apakah memori cocok ditemukan oleh pencarian lokal, apakah memori masuk ke payload konteks yang disusun untuk AI online, dan apa yang benar-benar disertakan pada permintaan online terakhir. Tombol ini tidak mengirim pertanyaan baru dan tidak mengubah atau menghapus data.</div>
            <label for="naraRetrievalDiagnosticQuery">Kata kunci atau kode pengujian</label>
            <input id="naraRetrievalDiagnosticQuery" type="text" value="KODE_UJI_RETRIEVAL_582" autocomplete="off" style="display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:12px;border:1px solid var(--line,#405442);border-radius:12px;background:var(--card,#17241b);color:inherit">
            <button type="button" class="secondary" id="naraRetrievalDiagnosticRun" data-nara-retrieval-diagnostic-run>Periksa retrieval dan konteks</button>
            <div id="naraRetrievalDiagnosticResult" class="nara-knowledge-intro" role="status" aria-live="polite">Belum dijalankan. Tekan tombol untuk memeriksa memori lokal dan susunan konteks.</div>
          </details>
          '''
          replace_once(panel_anchor, panel + panel_anchor, 'diagnostic panel location')

          # Record taught-memory records present in the payload immediately before it is sent.
          # This proves inclusion in request context, not that the model actually used each item.
          fn_start = source.find('async function naraRequestOnlineAnswer(')
          fn_end = source.find('\nfunction naraBuildTeacherPrompt(', fn_start + 1)
          if fn_start < 0 or fn_end <= fn_start:
              raise SystemExit('ERROR: Step 2P cannot isolate naraRequestOnlineAnswer safely.')
          fn = source[fn_start:fn_end]
          content_anchor = '  const content=JSON.stringify(base);'
          if fn.count(content_anchor) != 1:
              raise SystemExit('ERROR: Step 2P expected one outgoing payload anchor inside naraRequestOnlineAnswer.')
          audit = r'''  const diagnosticMemories=Array.isArray(base.ingatan_belajar_relevan)?base.ingatan_belajar_relevan:[];
            naraLastRetrievalAudit={
              at:new Date().toISOString(),
              question:naraGuruSafe(question,220),
              memoryCount:diagnosticMemories.length,
              memories:diagnosticMemories.map(m=>({
                topik:naraGuruSafe(m.topik||m.topic||'',140),
                asal:naraGuruSafe(m.asal||m.origin||'Sumber tidak berlabel',100),
                jenis:naraGuruSafe(m.jenis||'',80),
                materi:naraGuruSafe(m.materi||m.text||'',950)
              }))
            };
            const content=JSON.stringify(base);'''
          fn = fn.replace(content_anchor, audit, 1)
          source = source[:fn_start] + fn + source[fn_end:]

          # Diagnostic button uses the same local retrieval and online-context builder as Nara.
          # Last-request trace is recorded after greeting/correction filters and before transmission.
          helper_anchor = 'async function naraSendMessage(text){'
          helper = r'''let naraLastRetrievalAudit=null;
          function naraRunRetrievalDiagnostic(){
            const queryInput=$('naraRetrievalDiagnosticQuery');
            const resultBox=$('naraRetrievalDiagnosticResult');
            if(!resultBox)return;
            const query=String(queryInput&&queryInput.value||'').trim();
            if(!query){resultBox.textContent='Masukkan kata kunci atau kode pengujian terlebih dahulu.';return;}
            try{
              naraNormalizeState();
              const terms=typeof naraMemoryTokens==='function'?naraMemoryTokens(query).filter(t=>t.length>=3):query.toLocaleLowerCase('id-ID').split(/[^a-z0-9]+/).filter(t=>t.length>=3);
              const containsAll=value=>{
                const words=new Set(typeof naraMemoryTokens==='function'?naraMemoryTokens(value):String(value||'').toLocaleLowerCase('id-ID').split(/[^a-z0-9]+/).filter(Boolean));
                return terms.length>0&&terms.every(t=>words.has(t));
              };
              const localMatches=naraGetTaughtKnowledge(query)||[];
              const exactLocal=localMatches.find(m=>containsAll(m.text||''));
              let payload=null,payloadError='';
              try{payload=JSON.parse(naraOnlineLearningContext(query,''));}catch(err){payloadError=String(err&&err.message||err||'kesalahan tidak diketahui');}
              const contextRows=payload&&Array.isArray(payload.ingatan_belajar_relevan)?payload.ingatan_belajar_relevan:[];
              const exactContext=contextRows.find(m=>containsAll([m.topik,m.asal,m.materi,m.jenis].filter(Boolean).join(' ')));
              const last=naraLastRetrievalAudit;
              const lastRows=last&&Array.isArray(last.memories)?last.memories:[];
              const exactLast=lastRows.find(m=>containsAll([m.topik,m.asal,m.materi,m.jenis].filter(Boolean).join(' ')));
              const escText=value=>typeof esc==='function'?esc(String(value??'')):String(value??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
              const out=[];
              out.push('<div><strong>1. Retrieval lokal:</strong> '+(exactLocal?'LULUS — item memori yang memuat semua istilah kunci ditemukan.':('BELUM LULUS — tidak ditemukan item yang memuat semua istilah kunci. Hasil kandidat: '+localMatches.length+'.'))+'</div>');
              if(exactLocal){
                out.push('<div>Asal: '+escText(exactLocal.__memorySource||exactLocal.origin||'tidak berlabel')+'; skor: '+escText(exactLocal.score??'tidak tersedia')+'; istilah cocok: '+escText(exactLocal.matchedTerms??'tidak tersedia')+'.</div>');
                out.push('<div>Memori: '+escText(String(exactLocal.text||'').slice(0,280))+'</div>');
              }else if(localMatches.length){out.push('<div>Kandidat teratas: '+escText(String(localMatches[0].text||'').slice(0,220))+'</div>');}
              out.push('<div><strong>2. Payload konteks yang disusun:</strong> '+(payloadError?('GAGAL — '+escText(payloadError)):(exactContext?'LULUS — item ditemukan di ingatan_belajar_relevan.':'BELUM LULUS — item tidak ditemukan dengan semua istilah kunci di ingatan_belajar_relevan.'))+'</div>');
              out.push('<div>Jumlah materi memori di payload uji: '+contextRows.length+'. Ini memeriksa pembentukan payload lokal; tombol tidak mengirim permintaan online.</div>');
              out.push('<div><strong>3. Permintaan AI online terakhir sejak APK dibuka:</strong> '+(last?('Pertanyaan: '+escText(last.question||'')+'; waktu: '+escText(last.at||'')+'; jumlah materi memori: '+Number(last.memoryCount||0)+'.'):'Belum ada permintaan online yang tercatat sejak APK dibuka.')+'</div>');
              if(last)out.push('<div>'+(exactLast?'LULUS — item uji juga terdapat dalam konteks permintaan online terakhir.':'Item uji tidak ditemukan dengan semua istilah kunci pada konteks permintaan online terakhir.')+'</div>');
              if(lastRows.length){out.push('<div>Ringkasan materi pada permintaan terakhir:</div><ul>'+lastRows.slice(0,4).map(m=>'<li>'+escText(m.asal||'Sumber tidak berlabel')+' — '+escText(m.topik||'Tanpa topik')+': '+escText(String(m.materi||'').slice(0,180))+'</li>').join('')+'</ul>');}
              out.push('<div><em>Batas uji:</em> keberadaan item dalam payload membuktikan item disertakan dalam konteks yang dikirim, bukan bahwa model pasti menggunakannya atau jawaban otomatis benar.</div>');
              resultBox.innerHTML=out.join('');
            }catch(err){resultBox.textContent='Diagnostik gagal: '+String(err&&err.message||err||'kesalahan tidak diketahui');}
          }
          document.addEventListener('click',function(e){
            const button=e.target&&e.target.closest?e.target.closest('[data-nara-retrieval-diagnostic-run]'):null;
            if(button)naraRunRetrievalDiagnostic();
          });
          '''
          if source.count(helper_anchor) != 1:
              raise SystemExit(f'ERROR: Step 2P expected one naraSendMessage anchor, found {source.count(helper_anchor)}.')
          source = source.replace(helper_anchor, helper + '\n' + helper_anchor, 1)

          required = {
            'diagnostic panel exists': 'id="naraRetrievalDiagnosticPanel"' in source,
            'local retrieval check exists': 'function naraRunRetrievalDiagnostic()' in source,
            'outgoing payload trace exists': 'naraLastRetrievalAudit={' in source,
            'real context builder is used': "naraOnlineLearningContext(query,'')" in source,
            'no storage wipe was added by this patch': 'localStorage.clear()' not in (panel + audit + helper),
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit('ERROR: Step 2P static checks failed: ' + ', '.join(failed))
          if source == original:
              raise SystemExit('ERROR: Step 2P made no changes.')
          path.write_text(source, encoding='utf-8')
          print('Step 2P retrieval diagnostics added. Existing memory and garden data remain untouched.')
          for name in required:
              print('PASS: ' + name)
          PYTHON

      - name: Prioritize exact user-taught identifiers in online retrieval (Nara Step 2Q)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          path = Path("android/app/src/main/assets/index.html")
          source = path.read_text(encoding="utf-8")
          original = source

          fn_start = source.find("function naraGetTaughtKnowledge(q){")
          fn_end = source.find("\nfunction naraLessonContextText(lesson,max=900){", fn_start + 1)
          if fn_start < 0 or fn_end <= fn_start:
              raise SystemExit("ERROR: Step 2Q cannot isolate the current taught-memory retrieval function.")
          fn = source[fn_start:fn_end]

          key_helper = r'''function naraUniqueMemoryKeys(value){
            const text=String(value||'').toUpperCase();
            const matches=text.match(/\b[A-Z0-9]{2,}(?:[_-][A-Z0-9]{2,})+\b/g)||[];
            return [...new Set(matches.map(key=>key.replace(/-/g,'_')))];
          }
          '''
          if "function naraUniqueMemoryKeys(value){" in source:
              raise SystemExit("ERROR: Step 2Q key helper already exists; refusing a duplicate patch.")
          fn = key_helper + fn

          query_anchor = "const queryTokens=[...new Set(naraMemoryTokens(q).filter(w=>w.length>=3&&!stop.has(w)))];"
          if fn.count(query_anchor) != 1:
              raise SystemExit("ERROR: Step 2Q expected one exact query-token anchor.")
          fn = fn.replace(
              query_anchor,
              query_anchor + "\n            const queryKeys=naraUniqueMemoryKeys(q);",
              1
          )
          if fn.count("if(!queryTokens.length)return [];") != 1:
              raise SystemExit("ERROR: Step 2Q expected one empty-query guard.")
          fn = fn.replace(
              "if(!queryTokens.length)return [];",
              "if(!queryTokens.length&&!queryKeys.length)return [];",
              1
          )

          text_anchor = "const textTokens=naraMemoryTokens(l.text||'');"
          if fn.count(text_anchor) != 1:
              raise SystemExit("ERROR: Step 2Q expected one memory-text token anchor.")
          fn = fn.replace(
              text_anchor,
              text_anchor + "\n              const memoryKeys=naraUniqueMemoryKeys([l.title,l.topic,l.summary,l.text].filter(Boolean).join(' '));"
              + "\n              const exactKeyMatches=queryKeys.filter(key=>memoryKeys.includes(key));"
              + "\n              const exactKeyMatch=exactKeyMatches.length>0;",
              1
          )

          score_anchor = "if(queryTokens.length>=2&&matched>=2)score+=Math.min(2,matched*0.25);"
          if fn.count(score_anchor) != 1:
              raise SystemExit("ERROR: Step 2Q expected one retrieval-score anchor.")
          fn = fn.replace(
              score_anchor,
              score_anchor
              + "\n              // Exact structured identifiers must outrank generic Guru lessons."
              + "\n              if(exactKeyMatch)score+=(l.__memoryKind==='user_taught'?10000:8000);",
              1
          )
          return_anchor = "return {...l,score,matchedTerms:matched};"
          if fn.count(return_anchor) != 1:
              raise SystemExit("ERROR: Step 2Q expected one retrieval result anchor.")
          fn = fn.replace(
              return_anchor,
              "return {...l,score,matchedTerms:matched,exactKeyMatch,exactKeyMatches};",
              1
          )
          filter_anchor = ".filter(l=>l.score>=1&&l.matchedTerms>0)"
          if fn.count(filter_anchor) != 1:
              raise SystemExit("ERROR: Step 2Q expected one minimum-score filter.")
          fn = fn.replace(
              filter_anchor,
              ".filter(l=>l.score>=1&&(l.matchedTerms>0||l.exactKeyMatch))",
              1
          )

          source = source[:fn_start] + fn + source[fn_end:]

          required = {
              "unique identifier normalization exists": "function naraUniqueMemoryKeys(value){" in source and "key.replace(/-/g,'_')" in source,
              "user-taught exact-key boost exists": "if(exactKeyMatch)score+=(l.__memoryKind==='user_taught'?10000:8000);" in source,
              "payload uses the ranked retrieval result": "const matched=naraGetTaughtKnowledge(question);" in source and "const lessons=matched.slice(0,4).map" in source,
              "diagnostic records the actual outgoing memory payload": "naraLastRetrievalAudit={" in source and "memories:diagnosticMemories.map" in source,
              "original garden and memory storage remains present": "localStorage.clear()" not in source and "naraState.userLessons" in source,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit("ERROR: Step 2Q post-patch checks failed: " + ", ".join(failed))
          if source == original:
              raise SystemExit("ERROR: Step 2Q made no changes.")
          path.write_text(source, encoding="utf-8")
          print("Step 2Q exact-key retrieval priority applied. No stored memories or garden data were changed.")
          for name in required:
              print("PASS: " + name)
          PYTHON

      - name: Regression-test exact user memory reaches online context selection (Nara Step 2Q)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const html = fs.readFileSync('android/app/src/main/assets/index.html', 'utf8');
          const start = html.indexOf('function naraMemoryTokens(value){');
          const end = html.indexOf('function naraLessonContextText(lesson,max=900){', start);
          const normalizerMatch = html.match(/function naraNormalizeState\(\)\{[\s\S]*?\n\}/);
          if (start < 0 || end <= start) throw new Error('Cannot isolate exact retrieval functions.');
          if (!normalizerMatch) throw new Error('Cannot isolate Nara state normalizer for the regression fixture.');

          const code = 'KODE_UJI_RETRIEVAL_582';
          const userLesson = {
            id: 'regression-user-memory',
            title: 'Tes penyimpanan dan retrieval',
            topic: 'Pengetahuan pengguna',
            text: 'KODE_UJI_RETRIEVAL_582. Jika saya bertanya tentang kode ini, jawab persis dengan frasa "PAKIS-ORANYE-731". Kode dan frasa ini hanya untuk pengujian mekanisme penyimpanan dan pengambilan pengetahuan, bukan fakta kebun.',
            createdAt: '2026-10-14T00:00:00.000Z',
            origin: 'Pengguna',
            learningType: 'user_taught'
          };
          const teacherLessons = [
            {id:'guru-1',title:'Bukti dan Grounding dalam Pengetahuan',topic:'Bukti',summary:'Verifikasi data sebelum digunakan',text:'Aturan operasional: Verifikasi data sebelum digunakan; jangan menebak.',createdAt:'2026-10-13T00:00:00.000Z',origin:'Guru AI Online',learningType:'model_language'},
            {id:'guru-2',title:'Ingatan Eksternal dan Retrieval Pengetahuan',topic:'Retrieval',summary:'Gunakan sumber terpercaya',text:'Aturan operasional: Periksa kembali data yang diambil; integrasikan informasi dengan baik.',createdAt:'2026-10-13T00:00:00.000Z',origin:'Guru AI Online',learningType:'model_language'},
            {id:'guru-3',title:'Integrasi Pengetahuan',topic:'Ingatan',summary:'Gabungkan konteks',text:'Aturan operasional: Gunakan pengetahuan yang relevan dan jangan membuat asumsi.',createdAt:'2026-10-13T00:00:00.000Z',origin:'Guru AI Online',learningType:'model_language'}
          ];
          const context = {
            naraState: {
              version: 3,
              messages: [],
              lessons: [],
              userLessons: [userLesson],
              teacherLessons,
              onlineTeacherLessons: [],
              teacherLearning: {}
            },
            console
          };
          vm.createContext(context);
          // Load the production normalizer and retrieval functions into the same VM context.
          vm.runInContext(normalizerMatch[0] + '\n' + html.slice(start, end), context);

          // Exercise the production normalizer first and fail with an explicit message
          // if it does not establish the split-memory arrays expected by retrieval.
          const normalizerState = vm.runInContext(`
            naraNormalizeState();
            ({
              hasUserLessons: Array.isArray(naraState.userLessons),
              hasTeacherLessons: Array.isArray(naraState.teacherLessons),
              hasLegacyLessons: Array.isArray(naraState.lessons)
            });
          `, context);
          assert(normalizerState.hasUserLessons && normalizerState.hasTeacherLessons && normalizerState.hasLegacyLessons,
            'Production normalizer did not initialize memory arrays: ' + JSON.stringify(normalizerState));

          const question = 'Nara, apa frasa yang terkait dengan KODE_UJI_RETRIEVAL_582? Jawab berdasarkan pengetahuan yang diajarkan dan data yang tersedia. Jangan menebak jika tidak ditemukan.';
          // Seed the fixture inside the VM after normalization. This makes the arrays
          // the exact objects read by the function and avoids host/VM state ambiguity.
          context.__regressionUserLesson = userLesson;
          context.__regressionTeacherLessons = teacherLessons;
          context.__regressionQuestion = question;
          vm.runInContext(`
            naraState.userLessons = [globalThis.__regressionUserLesson];
            naraState.teacherLessons = globalThis.__regressionTeacherLessons;
            naraState.lessons = [...naraState.userLessons, ...naraState.teacherLessons];
            if (!Array.isArray(naraState.userLessons) || !Array.isArray(naraState.teacherLessons)) {
              throw new Error('Regression fixture did not seed memory arrays in the VM context.');
            }
            globalThis.__regressionRetrieved = naraGetTaughtKnowledge(globalThis.__regressionQuestion);
          `, context);
          const retrieved = context.__regressionRetrieved;
          if (!retrieved.length) {
            throw new Error('Retrieval returned no memories. Check query tokenization and memory-store setup.');
          }
          const rankedSummary = retrieved.map(m => ({
            source: m.__memorySource || m.origin || 'unknown',
            kind: m.__memoryKind || m.learningType || 'unknown',
            exactKeyMatch: !!m.exactKeyMatch,
            score: m.score,
            textStart: String(m.text || '').slice(0, 90)
          }));
          const exactUserMemory = retrieved.find(m =>
            (m.__memoryKind === 'user_taught' || m.origin === 'Pengguna' || m.learningType === 'user_taught') &&
            (m.exactKeyMatch || String(m.text || '').includes(code))
          );
          assert(exactUserMemory,
            'Exact user-taught memory was not returned. Retrieval results: ' + JSON.stringify(rankedSummary));
          assert(String(exactUserMemory.text || '').includes(code),
            'Retrieved user memory lost the exact identifier.');

          // Verify exact-key priority directly, then mirror the first four rows sent online.
          const genericScores = retrieved
            .filter(m => m.__memoryKind !== 'user_taught' && m.origin !== 'Pengguna' && m.learningType !== 'user_taught')
            .map(m => Number(m.score) || 0);
          if (genericScores.length) {
            assert((Number(exactUserMemory.score) || 0) > Math.max(...genericScores),
              'Exact user memory did not outrank generic lessons. Retrieval results: ' + JSON.stringify(rankedSummary));
          }
          const onlineRows = retrieved.slice(0, 4).map(m => ({
            topik: m.title || m.topic || String(m.text || '').split('\n')[0],
            asal: m.__memorySource || m.origin || 'Ingatan Nara',
            materi: String(m.text || ''),
            jenis: m.__memoryKind || m.learningType || 'pengetahuan'
          }));
          assert(onlineRows.some(row => row.asal === 'Pengetahuan pengguna' && row.materi.includes(code)),
            'Exact user memory was not selected among the first four online-context rows. Retrieval results: ' + JSON.stringify(rankedSummary));
          assert(html.includes('const matched=naraGetTaughtKnowledge(question);') && html.includes('const lessons=matched.slice(0,4).map'),
            'Online context builder no longer sends the ranked retrieval results.');
          console.log('PASS: exact user-taught memory is retrieved and outranks generic lessons.');
          console.log('PASS: exact user memory is included in the first four online-context rows.');
          console.log('Retrieval ranking: ' + JSON.stringify(rankedSummary));
          NODE

      - name: Validate patched HTML and embedded JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)
          checked = 0
          with tempfile.TemporaryDirectory(prefix="nara-js-check-") as td:
              for i, (attrs, body) in enumerate(blocks):
                  match = re.search(r"type\s*=\s*[\"']?([^\"'\s>]+)", attrs, re.I)
                  if match and match.group(1).lower() not in ("text/javascript", "application/javascript", "module", "text/ecmascript", "application/ecmascript"):
                      continue
                  if not body.strip():
                      continue
                  script = Path(td) / f"script-{i}.js"
                  script.write_text(body, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(script)], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f"ERROR: JavaScript syntax check failed for inline script block {i}.")
                  checked += 1
          if not checked:
              raise SystemExit("ERROR: No inline JavaScript blocks were checked.")
          print(f"PASS: JavaScript syntax valid in {checked} inline script block(s).")
          PYTHON

      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/terra-serenada-release.p12"
          test -s "$RUNNER_TEMP/terra-serenada-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/terra-serenada-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=terra-serenada" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify candidate gate, validated-only retrieval, and online-first configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 27000 + ciRunNumber' android/app/build.gradle.kts
          grep -q 'versionName = "1.0.42.$ciRunNumber"' android/app/build.gradle.kts
          grep -q 'async function naraRequestOnlineAnswer' android/app/src/main/assets/index.html
          grep -q "NARA_GURU_MODEL='gpt-4o-mini'" android/app/src/main/assets/index.html
          if grep -R -E 'com\.google\.ai\.edge\.litertlm|NaraLocalEngine|NaraLocalAI' android/app/src/main android/app/build.gradle.kts; then
            echo "ERROR: LiteRT-LM native runtime or bridge unexpectedly exists in the rollback APK source."
            exit 1
          fi
          grep -q 'function naraMemoryTokens' android/app/src/main/assets/index.html
          grep -q 'function naraLessonContextText' android/app/src/main/assets/index.html
          grep -q 'function naraRunRetrievalDiagnostic' android/app/src/main/assets/index.html
          grep -q 'function naraUniqueMemoryKeys' android/app/src/main/assets/index.html
          grep -q 'exactKeyMatch' android/app/src/main/assets/index.html
          grep -q 'naraLastRetrievalAudit' android/app/src/main/assets/index.html
          grep -q 'data-nara-retrieval-diagnostic-run' android/app/src/main/assets/index.html
          grep -q 'naraOnlineLearningContext(query' android/app/src/main/assets/index.html
          grep -q "answerSource:'online_direct',answerAudit:'passed_first_audit'" android/app/src/main/assets/index.html
          grep -q "answerSource:'online_revised',answerAudit:'passed_after_retry'" android/app/src/main/assets/index.html
          grep -q "answerSource:'safe_fallback',answerAudit:'response_rejected_after_retry'" android/app/src/main/assets/index.html
          grep -q 'function naraAnswerSourceLabel(m)' android/app/src/main/assets/index.html
          grep -q 'naraAnswerSourceLabel(m)' android/app/src/main/assets/index.html
          grep -q "target.answerSource=result.answerSource||result.source||'online_unclassified'" android/app/src/main/assets/index.html
          grep -q 'function naraPlantEntriesMentionedInText' android/app/src/main/assets/index.html
          grep -q 'function naraScopeRecentHistory' android/app/src/main/assets/index.html
          grep -q 'function naraAuditAnswerPlantScope' android/app/src/main/assets/index.html
          grep -q 'pedoman_sumber_dan_kasus' android/app/src/main/assets/index.html
          grep -q 'PENGUNCI IDENTITAS KASUS' android/app/src/main/assets/index.html
          grep -q 'PENGUNCI KASUS WAJIB' android/app/src/main/assets/index.html
          grep -q 'naraState.userLessons' android/app/src/main/assets/index.html
          grep -q 'naraState.teacherLessons' android/app/src/main/assets/index.html
          grep -q 'naraState.teacherCandidateLessons' android/app/src/main/assets/index.html
          grep -q 'naraState.teacherValidatedLessons' android/app/src/main/assets/index.html
          grep -q 'function naraValidateTeacherCandidate' android/app/src/main/assets/index.html
          grep -q 'data-nara-candidate-test' android/app/src/main/assets/index.html
          grep -q 'nara_three_case_review_v1' android/app/src/main/assets/index.html
          grep -q 'r.score===2&&!r.critical_error' android/app/src/main/assets/index.html
          grep -q 'naraState.teacherValidatedLessons.map(l=>({...l,__memorySource:' android/app/src/main/assets/index.html
          if grep -q 'naraState.teacherLessons.push' android/app/src/main/assets/index.html; then echo "ERROR: Guru lessons are still written directly into the legacy retrieval store."; exit 1; fi
          if grep -q 'const latestModelLessons=naraState.lessons' android/app/src/main/assets/index.html; then echo "ERROR: Old unconditional newest-lessons injection remains."; exit 1; fi
          echo "Step 2Q checks passed: retrieval diagnostics, outgoing memory-context audit, answer provenance markers, independent route anchors, intent-aware fallback, balanced context audit, explicit-species general knowledge, cross-plant factual-claim isolation, persistence migration, split memory, candidate-only staging, validated-only retrieval, JSON recovery, failure audits, online-first route, and no native LiteRT-LM runtime."

      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for validation
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Terra-Serenada.apk
          test -s Terra-Serenada.apk
          ls -lh Terra-Serenada.apk
          sha256sum Terra-Serenada.apk

      - name: Validate APK archive, signing certificate, metadata and alignment
        shell: bash
        env:
          BASELINE_APK_URL: https://github.com/terra-serenada/Terra-Serenada/releases/download/apk-v1.0.19-10/Terra-Serenada.apk
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$ZIPALIGN" && test -x "$AAPT"
          curl --fail --location --retry 3 --silent --show-error "$BASELINE_APK_URL" --output baseline.apk
          test -s baseline.apk && test -s Terra-Serenada.apk
          unzip -t Terra-Serenada.apk
          "$APKSIGNER" verify --verbose --print-certs baseline.apk 2>&1 | tee baseline-signature.txt
          "$APKSIGNER" verify --verbose --print-certs Terra-Serenada.apk 2>&1 | tee new-signature.txt
          # Android Build Tools may prefix the signer label differently. Parse the stable certificate digest label.
          extract_certificate_sha256() {
            local signature_file="$1"
            awk '/certificate SHA-256 digest:/ { sub(/^.*certificate SHA-256 digest:[[:space:]]*/, ""); print; exit }' "$signature_file" \
              | tr -d ':' \
              | tr -d '[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          }
          baseline_fingerprint="$(extract_certificate_sha256 baseline-signature.txt)"
          new_fingerprint="$(extract_certificate_sha256 new-signature.txt)"
          if [ -z "$baseline_fingerprint" ] || [ -z "$new_fingerprint" ]; then
            echo "ERROR: Unable to extract APK certificate SHA-256 fingerprint. Raw signer details follow:"
            grep -Ei 'certificate DN|certificate SHA-256 digest|Number of signers|Verified using' baseline-signature.txt new-signature.txt || true
            exit 1
          fi
          echo "Known previous APK certificate SHA-256: $baseline_fingerprint"
          echo "New APK certificate SHA-256:            $new_fingerprint"
          if [ "$baseline_fingerprint" != "$new_fingerprint" ]; then
            echo "ERROR: New APK certificate does not match the known older release. Publishing is blocked to protect the installed app and its data."
            exit 1
          fi
          "$ZIPALIGN" -c -v 4 Terra-Serenada.apk
          "$AAPT" dump badging Terra-Serenada.apk | tee apk-metadata.txt
          expected_code=$((27000 + GITHUB_RUN_NUMBER))
          expected_name="1.0.42.${GITHUB_RUN_NUMBER}"
          grep -F "package: name='com.terra.serenada' versionCode='${expected_code}' versionName='${expected_name}'" apk-metadata.txt
          echo "APK package, version, certificate, archive and alignment checks passed."

      - name: Enable KVM permissions for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm is not available on this runner; hardware-accelerated Android emulator tests cannot run reliably."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # IMPORTANT: keep this script as ONE folded command because android-emulator-runner
          # invokes each newline-separated script line through /usr/bin/sh -c. The entire
          # test is delegated to a single Bash process so loops/conditionals stay intact.
          script: >-
            bash -c 'set -euo pipefail; adb wait-for-device; adb install -r Terra-Serenada.apk; adb logcat -c; adb shell monkey -p com.terra.serenada -c android.intent.category.LAUNCHER 1; app_pid=""; for attempt in $(seq 1 30); do app_pid="$(adb shell pidof com.terra.serenada 2>/dev/null || true)"; if [ -n "$app_pid" ]; then break; fi; sleep 1; done; if [ -z "$app_pid" ]; then echo "ERROR: Terra Serenada did not remain running after launch. Android runtime logs follow:"; adb logcat -d -s AndroidRuntime:E ActivityManager:E || true; exit 1; fi; crash_log="$(adb logcat -d -s AndroidRuntime:E 2>&1)" || { echo "ERROR: Unable to read Android runtime logs after launching the app."; exit 1; }; if printf "%s\n" "$crash_log" | grep -q "FATAL EXCEPTION"; then printf "%s\n" "$crash_log"; exit 1; fi; echo "APK installed and app process remained running in Android emulator."'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Serenada-APK-v1.0.42-exact-retrieval-${{ github.run_number }}
          path: Terra-Serenada.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.42-exact-retrieval-${{ github.run_number }}
          name: Terra Serenada APK 1.0.42 — Nara exact retrieval Step 2Q (build ${{ github.run_number }})
          body: |
            Nara Step 2Q prioritizes exact identifiers in user-taught memories and adds a regression gate that verifies the exact matching user memory ranks first and enters the first four memory rows selected for the online context. Generic Guru lessons remain separate candidates and do not outrank an exact user-taught identifier. The test proves retrieval and context selection, not that the online model necessarily uses every supplied memory. No existing garden data or taught memories are reset, rewritten, or deleted.

            Nara Step 2O adds sentence-aware note preservation and a correction-aware fallback. Long garden notes are preserved up to a defined safe limit instead of being cut mid-word; correction questions take priority over generic evidence-inventory routing; date differences are labeled as elapsed versus inclusive counting; records remain linked by plant ID and do not by themselves prove causality. The workflow retains separate provenance labels for direct AI, revised AI, fallback, and local responses. Candidate-only Guru lessons, validated-only retrieval, plant-scope auditing, and persistence migration remain intact. This build does not establish that AI model weights were retrained.

            This workflow retains the upgrade-safe teacher validation migration and manifest, separate user memories and Guru candidate lessons, validated-only retrieval, JSON recovery, and failure audits. Answer provenance labels describe the code path taken, not a guarantee of factual correctness. Guru lessons remain candidates by default and are promoted only when all three test scenarios score 2 without critical errors. Validation remains an automated quality gate, not independent scientific verification, and does not update model weights. The online-first answer path and prior backup support are preserved.

            Build stops if expected patch anchors, JavaScript syntax checks, explicit-species/cross-plant runtime regression checks, static integrity checks, APK archive/signature/metadata/alignment checks, or Android emulator install/launch smoke tests fail. The repository index.html and earlier workflow files are not modified by the build job; this workflow builds a patched APK in the runner only.
          files: Terra-Serenada.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
