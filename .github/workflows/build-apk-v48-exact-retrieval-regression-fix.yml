          end_matches = list(re.finditer(end_pattern, source))
          if len(end_matches) != 1:
              raise SystemExit(f'ERROR: expected one structurally matched normalizer end, found {len(end_matches)}.')
          end_match = end_matches[0]
          manifest_recovery = "            // Only recover learning-cycle flags when the main saved state does not yet contain them.\n            if(priorManifest&&priorManifest.teacherLearning){const pt=priorManifest.teacherLearning;if(!old||typeof old!=='object'||!('foundationCompleted' in old))naraState.teacherLearning.foundationCompleted=!!pt.foundationCompleted;if(!old||typeof old!=='object'||!('batchCurriculumCompleted' in old))naraState.teacherLearning.batchCurriculumCompleted=!!pt.batchCurriculumCompleted;}\n            naraInstallTeacherValidationManifestPersistence();\n            naraTeacherValidationManifestWrite();"
          end_new = end_match.group(1) + "\n" + manifest_recovery + "\n" + end_match.group(2)
          source = source[:end_match.start()] + end_new + source[end_match.end():]

          checks={
            'stable teacher lesson fingerprint exists':'function naraTeacherLessonFingerprint(m)' in source,
            'legacy passed lessons unioned even when validated array exists':'const validatedSeed=[...naraState.teacherValidatedLessons,...oldTeacherLessons.filter(isPassed),...legacyLessons.filter(isPassed)]' in source,
            'validated candidates restore only from explicit passing manifest':'e.status===\'validated\'&&e.validation&&e.validation.status===\'passed\'&&e.validation.method===\'nara_three_case_review_v1\'' in source,
            'same-content duplicates do not remain candidates':'finalValidFp.has(naraTeacherLessonFingerprint(m))' in source,
            'manifest writes on persistence':'naraTeacherValidationManifestWrite();return result' in source,
            'validated-only retrieval preserved':"naraState.teacherValidatedLessons.map(l=>({...l,__memorySource:'Guru AI Online (lolos uji otomatis)'" in source,
            'three-case gate preserved':'r.score===2&&!r.critical_error' in source,
            'failure audits preserved':'function naraValidationAuditHtml(validation)' in source,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('ERROR: Step 2E checks failed: '+', '.join(failed))
          if source==original: raise SystemExit('ERROR: Step 2E made no source changes.')
          path.write_text(source,encoding='utf-8')
          print('Step 2E upgrade-safe teacher validation migration applied.')
          for k in checks: print('PASS:',k)
          PYTHON

