      - name: Separate Guru candidate lessons from validated memory (Nara Step 2C)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          #!/usr/bin/env python3
          from pathlib import Path
          import re
          
          path = Path('android/app/src/main/assets/index.html')
          source = path.read_text(encoding='utf-8')
          original = source
          
          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: candidate/validated patch stopped at {label}: expected 1 exact anchor, found {count}.')
              source = source.replace(old, new, 1)
          
          # 1) Migrate old unreviewed Guru lessons into a candidate queue. Only entries carrying
          #    the explicit validation marker produced by this version are considered validated.
          pattern = r'function naraNormalizeState\(\)\{[\s\S]*?\n\}'
          matches = list(re.finditer(pattern, source))
          if len(matches) != 1:
              raise SystemExit(f'ERROR: expected one naraNormalizeState function, found {len(matches)}.')
          new_normalizer = r'''function naraNormalizeState(){
            if(!naraState||typeof naraState!=='object'||Array.isArray(naraState))naraState={version:4,messages:[],lessons:[],userLessons:[],teacherLessons:[],teacherCandidateLessons:[],teacherValidatedLessons:[],onlineTeacherLessons:[],teacherLearning:{},updatedAt:''};
            naraState.version=4;
            if(!Array.isArray(naraState.messages))naraState.messages=[];
            if(!Array.isArray(naraState.lessons))naraState.lessons=[];
            const legacyLessons=naraState.lessons.filter(m=>m&&typeof m.text==='string');
            const isTeacherLesson=m=>!!(m&&typeof m==='object'&&(m.learningType==='model_language'||m.origin==='Guru AI Online'||m.sourceTeacherLessonId));
            const isPassed=m=>!!(m&&typeof m==='object'&&m.validationStatus==='validated'&&m.validation&&m.validation.status==='passed'&&m.validation.method==='nara_three_case_review_v1');
            if(!Array.isArray(naraState.userLessons))naraState.userLessons=legacyLessons.filter(m=>!isTeacherLesson(m));
            const oldTeacherLessons=Array.isArray(naraState.teacherLessons)?naraState.teacherLessons.filter(m=>m&&typeof m==='object'&&typeof m.text==='string'):legacyLessons.filter(isTeacherLesson);
            if(!Array.isArray(naraState.teacherValidatedLessons))naraState.teacherValidatedLessons=oldTeacherLessons.filter(isPassed);
            if(!Array.isArray(naraState.teacherCandidateLessons))naraState.teacherCandidateLessons=oldTeacherLessons.filter(m=>!isPassed(m)).map(m=>({...m,validationStatus:'candidate',validation:m.validation&&m.validation.status==='failed'?m.validation:null}));
            naraState.userLessons=naraState.userLessons.filter(m=>m&&typeof m==='object'&&typeof m.text==='string').slice(-500);
            naraState.teacherCandidateLessons=naraState.teacherCandidateLessons.filter(m=>m&&typeof m==='object'&&typeof m.text==='string'&&!isPassed(m)).map(m=>({...m,validationStatus:'candidate'})).slice(-200);
            naraState.teacherValidatedLessons=naraState.teacherValidatedLessons.filter(m=>m&&typeof m==='object'&&typeof m.text==='string'&&isPassed(m)).slice(-200);
            // Compatibility arrays remain in backup JSON, but only teacherValidatedLessons may feed retrieval.
            naraState.teacherLessons=naraState.teacherValidatedLessons.slice();
            naraState.lessons=[...naraState.userLessons,...naraState.teacherCandidateLessons,...naraState.teacherValidatedLessons].sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))).slice(-900);
            if(!Array.isArray(naraState.onlineTeacherLessons))naraState.onlineTeacherLessons=[];
            naraState.messages=naraState.messages.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.text==='string').slice(-80);
            const statusById=new Map([...naraState.teacherCandidateLessons.map(m=>[m.id,'candidate']),...naraState.teacherValidatedLessons.map(m=>[m.id,'validated'])]);
            naraState.onlineTeacherLessons=naraState.onlineTeacherLessons.filter(m=>m&&typeof m==='object'&&typeof m.title==='string').map(m=>({...m,validationStatus:statusById.get(m.id)||m.validationStatus||'candidate'})).slice(-40);
            const old=naraState.teacherLearning&&typeof naraState.teacherLearning==='object'?naraState.teacherLearning:{};
            naraState.teacherLearning={...old,enabled:old.enabled!==false,foundationCompleted:!!old.foundationCompleted,batchCurriculumCompleted:!!old.batchCurriculumCompleted,totalUserQuestions:Math.max(0,Number(old.totalUserQuestions)||0),lastAutoQuestionCount:Math.max(0,Number(old.lastAutoQuestionCount)||0),automaticCycleCount:Math.max(0,Number(old.automaticCycleCount)||0),queued:!!old.queued,lastAutoLessonAt:old.lastAutoLessonAt||null,lastAutoAttemptAt:old.lastAutoAttemptAt||null};
          }'''
          source = source[:matches[0].start()] + new_normalizer + source[matches[0].end():]
          
          # 2) Retrieval must use only explicit user-taught memories and validated Guru lessons.
          replace_once("...naraState.teacherLessons.map(l=>({...l,__memorySource:'Guru AI Online',__memoryKind:'model_language'}))", "...naraState.teacherValidatedLessons.map(l=>({...l,__memorySource:'Guru AI Online (lolos uji otomatis)',__memoryKind:'validated_model_language'}))", 'validated-only retrieval source')
          
          # Serialize teacher requests with candidate validation so two Worker teaching/evaluation flows do not race.
          replace_once("  const st=naraGuruState();if(!st.enabled)return false;\n  if(naraGuruBusy){st.queued=true;naraPersistState();return false;}", "  const st=naraGuruState();if(!st.enabled)return false;\n  if(naraTeacherValidationBusy){st.queued=true;naraPersistState();return false;}\n  if(naraGuruBusy){st.queued=true;naraPersistState();return false;}", 'serialize teaching behind candidate validation')
          
          # 3) Every new Guru lesson is stored as a candidate, never directly as validated memory.
          replace_once('naraState.teacherLessons.push(...records.map(x=>x.memory));', "naraState.teacherCandidateLessons.push(...records.map(x=>({...x.memory,validationStatus:'candidate',validation:null})));", 'batch candidate writer')
          replace_once('naraState.onlineTeacherLessons.push(...records.map(x=>x.history));naraState.onlineTeacherLessons=naraState.onlineTeacherLessons.slice(-40);', "naraState.onlineTeacherLessons.push(...records.map(x=>({...x.history,validationStatus:'candidate'})));naraState.onlineTeacherLessons=naraState.onlineTeacherLessons.slice(-40);", 'batch candidate history')
          replace_once('naraState.teacherLessons.push(mem);', "naraState.teacherCandidateLessons.push({...mem,validationStatus:'candidate',validation:null});", 'adaptive candidate writer')
          replace_once('naraState.onlineTeacherLessons.push({id,title,topic,summary,createdAt,model:result.model,stage,automatic});naraState.onlineTeacherLessons=naraState.onlineTeacherLessons.slice(-40);', "naraState.onlineTeacherLessons.push({id,title,topic,summary,createdAt,model:result.model,stage,automatic,validationStatus:'candidate'});naraState.onlineTeacherLessons=naraState.onlineTeacherLessons.slice(-40);", 'adaptive candidate history')
          
          # 4) Make statuses truthful: accepted from Guru means candidate saved, not validated knowledge.
          replace_once("naraSetGuruStatus('Paket fondasi tersimpan','good',`Selesai dalam satu sesi: ${records.length} materi fondasi disimpan sekaligus (${titles.join(' · ')}). Materi menjadi ingatan eksternal, bukan pelatihan ulang bobot model. Guru akan melanjutkan pendalaman otomatis setelah beberapa percakapan.`);", "naraSetGuruStatus(`${records.length} kandidat materi menunggu uji`,'warn',`Selesai dalam satu sesi: ${records.length} materi masuk antrean kandidat (${titles.join(' · ')}). Materi belum digunakan untuk menjawab sampai lolos uji otomatis. Uji kandidat satu per satu dari daftar ini; evaluasi otomatis bukan jaminan mutlak kebenaran.`);", 'batch candidate status')
          replace_once("naraSetGuruStatus('Mengajar otomatis aktif','good',`Materi terbaru tersimpan otomatis: “${title}”. Materi disimpan sebagai ingatan belajar, bukan sebagai fakta kebun terverifikasi.`);", "naraSetGuruStatus('Kandidat materi menunggu uji','warn',`Materi terbaru “${title}” masuk antrean kandidat. Materi belum digunakan untuk menjawab sampai lolos uji otomatis; penyimpanan bukan pengesahan fakta atau aturan.`);", 'adaptive candidate status')
          
          # 5) Replace the Guru-panel renderer to show candidate/validated status and validation controls.
          pattern = r'function naraRenderGuruPanel\(\)\{[\s\S]*?\n\}'
          matches = list(re.finditer(pattern, source))
          if len(matches) != 1:
              raise SystemExit(f'ERROR: expected one naraRenderGuruPanel function, found {len(matches)}.')
          new_renderer = r'''function naraValidationAuditHtml(validation){
            if(!validation||validation.status!=='failed')return '';
            const stageLabels={initialization:'Persiapan',design_scenarios:'Pembuatan skenario',answer_scenarios:'Pembuatan jawaban Nara',grade_scenarios:'Penilaian jawaban',persist_result:'Penyimpanan hasil'};
            const stage=stageLabels[validation.failureType]||'Kriteria kelulusan';
            const cases=Array.isArray(validation.testCases)?validation.testCases:[];
            const caseHtml=cases.map(c=>{
              const score=Number.isInteger(c.score)&&c.score>=0?String(c.score)+'/2':'Belum dinilai';
              const critical=c.critical_error===true?' · Kesalahan kritis: YA':(c.critical_error===false?' · Kesalahan kritis: tidak dilaporkan':' · Kesalahan kritis: belum dinilai');
              const points=Array.isArray(c.expected_points)?c.expected_points:[];
              const errors=Array.isArray(c.critical_errors)?c.critical_errors:[];
              return `<div style="border-top:1px solid var(--border);padding:10px 0;margin-top:8px"><strong>${esc(c.id||'Skenario')} · Skor ${esc(score)}${esc(critical)}</strong>${c.scenario?`<div style="margin-top:6px"><b>Skenario:</b> ${esc(c.scenario)}</div>`:''}${c.question?`<div style="margin-top:5px"><b>Pertanyaan:</b> ${esc(c.question)}</div>`:''}${points.length?`<div style="margin-top:5px"><b>Poin yang diharapkan:</b> ${esc(points.join(' · '))}</div>`:''}${errors.length?`<div style="margin-top:5px"><b>Kesalahan kritis yang dicari:</b> ${esc(errors.join(' · '))}</div>`:''}${c.answer?`<div style="margin-top:5px"><b>Jawaban Nara:</b> ${esc(c.answer)}</div>`:''}${c.feedback?`<div style="margin-top:5px"><b>Alasan penilai:</b> ${esc(c.feedback)}</div>`:''}</div>`;
            }).join('');
            return `<details open style="margin-top:8px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2)"><summary style="font-weight:700;cursor:pointer">Audit kegagalan · ${esc(stage)} (${cases.length}/3 skenario tersimpan)</summary><div style="margin-top:8px">${esc(validation.summary||'Uji belum lulus.')}</div>${caseHtml||'<div style="margin-top:8px">Belum ada skenario lengkap yang berhasil disimpan. Periksa tahap kegagalan dan coba lagi setelah penyebabnya ditangani.</div>'}</details>`;
          }
          function naraRenderGuruPanel(){
            const history=$('naraGuruHistory'),latestBox=$('naraGuruLatestLesson');if(!history||!latestBox)return;
            naraNormalizeState();
            const lessons=naraState.onlineTeacherLessons.slice().reverse();
            const st=naraGuruState();
            const candidates=naraState.teacherCandidateLessons;
            const validated=naraState.teacherValidatedLessons;
            const memoryById=new Map([...candidates,...validated].map(m=>[m.id,m]));
            const continueButton=$('naraGuruContinue');
            if(continueButton&&!naraGuruBusy&&!naraTeacherValidationBusy)continueButton.textContent=st.batchCurriculumCompleted?'📚 Minta Guru melanjutkan pelajaran':'📚 Ajarkan paket fondasi sekaligus';
            if(lessons.length){
              const l=lessons[0];const memory=memoryById.get(l.id);const passed=memory?.validationStatus==='validated';
              const label=passed?'Lolos uji otomatis':memory?'KANDIDAT · belum dipakai dalam retrieval':'Status materi belum diketahui';
              latestBox.innerHTML=`<div class="nara-guru-latest"><div class="nara-guru-latest-title">${esc(l.title||l.topic||'Pelajaran Guru AI Online')}</div><div class="nara-guru-latest-meta">${esc(l.createdAt?new Date(l.createdAt).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'Waktu tidak tersedia')} · ${esc(l.model||NARA_GURU_MODEL)} · ${esc(label)}</div><div class="nara-guru-latest-copy">${esc(l.summary||'Materi ajar telah disimpan sebagai kandidat.')}</div>${memory&&memory.validation?.status==='failed'?`<div class="nara-guru-latest-copy">Uji terakhir belum lulus: ${esc(memory.validation.summary||'Perlu ditinjau ulang.')}</div>${naraValidationAuditHtml(memory.validation)}`:''}${memory&&!passed?`<button type="button" data-nara-candidate-test="${esc(l.id)}" style="margin-top:8px;min-height:38px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-weight:650" ${naraTeacherValidationBusy?'disabled':''}>${memory.validation?.status==='failed'?'Uji ulang kandidat':'Uji kandidat'}</button>`:''}</div>`;
            }else{latestBox.innerHTML='<div class="nara-guru-latest"><div class="nara-guru-latest-title">Belum ada pelajaran Guru tersimpan</div><div class="nara-guru-latest-copy">Guru akan memulai dari fondasi model bahasa setelah koneksi tersedia. Materi baru akan masuk sebagai kandidat, bukan langsung dipakai.</div></div>';}
            history.innerHTML=lessons.slice(1,13).map(l=>{
              const memory=memoryById.get(l.id);const passed=memory?.validationStatus==='validated';
              const status=passed?'✅ Lolos uji otomatis':'🧪 Kandidat — belum dipakai';
              const button=memory&&!passed?`<button type="button" data-nara-candidate-test="${esc(l.id)}" style="margin-top:6px;min-height:36px;padding:7px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);font-weight:650" ${naraTeacherValidationBusy?'disabled':''}>${memory.validation?.status==='failed'?'Uji ulang kandidat':'Uji kandidat'}</button>`:'';
              const lastReview=memory?.validation?.testedAt?`<div style="font-size:.8em;opacity:.8;margin-top:4px">Uji terakhir: ${esc(new Date(memory.validation.testedAt).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}))}</div>`:'';
              const audit=memory?.validation?.status==='failed'?naraValidationAuditHtml(memory.validation):'';
              return `<div class="nara-guru-history-item"><div>${esc(l.title||l.topic||'Pelajaran')}</div><div style="font-size:.82em;opacity:.85;margin-top:4px">${esc(l.createdAt?new Date(l.createdAt).toLocaleDateString('id-ID'):'tanggal tidak tersedia')} · ${esc(status)}</div>${lastReview}${audit}${button}</div>`;
            }).join('');
            if(st.foundationCompleted&&!naraGuruBusy&&!naraTeacherValidationBusy&&!/^(Koneksi belum tersedia|Mode lokal aktif|Pengajaran gagal|Pengujian kandidat|Kandidat belum lulus|Kandidat lulus)/i.test($('naraGuruStatus')?.textContent||'')){
              if(candidates.length)naraSetGuruStatus(`${candidates.length} kandidat menunggu uji`,'warn','Materi Guru belum dipakai dalam retrieval sampai lolos uji otomatis. Tekan “Uji kandidat” pada materi yang ingin dievaluasi.');
              else naraSetGuruStatus('Materi Guru lolos uji otomatis','good','Semua materi Guru yang tersimpan sudah melewati pemeriksaan otomatis. Penilaian ini tetap dapat keliru dan bukan verifikasi fakta kebun.');
            }
          }'''
          source = source[:matches[0].start()] + new_renderer + source[matches[0].end():]
          
          # 6) Add test/grade/promote routines. A candidate can enter retrieval only if a three-case
          #    scenario test is structurally valid and every case receives a sufficient score with
          #    no critical error. The UI explicitly labels this as model-based automatic review.
          helpers = r'''let naraTeacherValidationBusy=false;
          function naraParseValidationJson(value){
            const raw=String(value||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
            if(!raw)throw new Error('Respons kosong; tidak ada JSON yang dapat dibaca.');
            const parseObject=text=>{const parsed=JSON.parse(text);if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw new Error('Root JSON harus berupa objek.');return parsed;};
            try{return parseObject(raw);}catch{}
            // Find the first balanced JSON object while respecting quotes and escaped characters.
            // This safely handles short prose before/after JSON without slicing at braces inside strings.
            let start=-1,depth=0,inString=false,escaped=false;
            for(let i=0;i<raw.length;i++){
              const ch=raw[i];
              if(start<0){if(ch==='{'){start=i;depth=1;}continue;}
              if(inString){if(escaped){escaped=false;continue;}if(ch==='\\'){escaped=true;continue;}if(ch==='"')inString=false;continue;}
              if(ch==='"'){inString=true;continue;}
              if(ch==='{')depth++;
              else if(ch==='}'){depth--;if(depth===0){try{return parseObject(raw.slice(start,i+1));}catch{start=-1;depth=0;}}}
            }
            throw new Error('Sintaks JSON tidak valid atau objek JSON tidak lengkap.');
          }
          async function naraGuruChatJson(messages,maxTokens,rootKey,shape,stage){
            let response=await naraGuruChat(messages,maxTokens);
            let lastError=null;
            for(let attempt=0;attempt<2;attempt++){
              try{
                const parsed=naraParseValidationJson(response?.text);
                if(!Array.isArray(parsed[rootKey]))throw new Error(`Objek JSON tidak memiliki array \"${rootKey}\".`);
                return {response,parsed};
              }catch(err){
                lastError=err;
                if(attempt===0){
                  const previous=String(response?.text||'').slice(0,5000);
                  response=await naraGuruChat([
                    ...messages,
                    {role:'assistant',content:previous||'(respons kosong)'},
                    {role:'user',content:`PERBAIKI FORMAT RESPONS SEBELUMNYA. Respons bukan satu objek JSON valid atau array root\u0020\"${rootKey}\" tidak ditemukan. Kembalikan hanya satu objek JSON valid tanpa Markdown atau teks tambahan. Skema wajib: ${shape}. Periksa tanda kutip, koma, kurung, escape karakter, dan pastikan array root bernama ${rootKey}. Jangan gunakan elipsis atau placeholder.`}
                  ],maxTokens);
                }
              }
            }
            throw new Error(`${stage}: JSON tetap tidak valid setelah satu percobaan pemulihan. ${lastError?.message||'Format respons tidak sesuai.'} Kandidat tetap belum tervalidasi.`);
          }
          async function naraValidateTeacherCandidate(id){
            let auditStage='initialization';
            let auditTests=[];
            let auditResponses=[];
            let auditResults=[];
            if(naraGuruBusy||naraTeacherValidationBusy){showToast('Guru sedang menjalankan proses lain. Coba lagi setelah selesai.');return false;}
            naraNormalizeState();
            const candidate=naraState.teacherCandidateLessons.find(l=>l.id===id);
            if(!candidate){showToast('Kandidat tidak ditemukan atau sudah diproses.');return false;}
            const button=[...document.querySelectorAll('[data-nara-candidate-test]')].find(b=>b.dataset.naraCandidateTest===id);
            naraTeacherValidationBusy=true;
            if(button){button.disabled=true;button.textContent='Menyiapkan pengujian…';}
            const continueButton=$('naraGuruContinue');if(continueButton)continueButton.disabled=true;
            naraSetGuruStatus('Menguji kandidat materi…','warn',`Guru sedang menyiapkan tiga skenario uji untuk “${naraGuruSafe(candidate.title||candidate.topic,120)}”. Materi tetap disisihkan dari retrieval selama proses ini.`);
            try{
              const material=naraGuruSafe(candidate.text,6000);
              auditStage='design_scenarios';
