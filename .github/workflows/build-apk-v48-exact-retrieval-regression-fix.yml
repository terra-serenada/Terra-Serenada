          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/assets/index.html')
          source = path.read_text(encoding='utf-8')
          original = source

          def replace_function(name: str, signature: str, body: str) -> None:
              global source
              pattern = rf'function {re.escape(name)}\({re.escape(signature)}\)\{{[\s\S]*?\n\}}'
              matches = list(re.finditer(pattern, source))
              if len(matches) != 1:
                  raise SystemExit(f'ERROR: Step 2I expected one {name} function, found {len(matches)}.')
              source = source[:matches[0].start()] + body + source[matches[0].end():]

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: Step 2I patch stopped at {label}: expected one anchor, found {count}.')
              source = source.replace(old, new, 1)

          replace_function('naraScopeRecentHistory', 'question,history', r'''function naraScopeRecentHistory(question,history){
            const items=(Array.isArray(history)?history:[]).slice(-8);
            if(!naraHasPlantTopic(question))return items;
            const focused=naraPlantEntriesMentionedInText(question);
            const explicitCrops=naraExplicitCropTerms(question);
            // An explicit species with no matching record is still answerable from general knowledge;
            // exclude only history that refers to other recorded plants, not the whole conversation.
            if(!focused.length&&explicitCrops.length){
              return items.filter(m=>naraPlantEntriesMentionedInText(m?.text||m?.isi||'').length===0);
            }
            if(!focused.length)return items;
            const focusIds=new Set(focused.map(p=>String(p.id||p.name)));
            // Filter each conflicting message individually. Keep neutral turns and turns scoped to the target.
            return items.filter(m=>{
              const mentioned=naraPlantEntriesMentionedInText(m?.text||m?.isi||'');
              return !mentioned.length||mentioned.every(p=>focusIds.has(String(p.id||p.name)));
            });
          }''')

          replace_function('naraAuditAnswerPlantScope', 'question,answer', r'''function naraAuditAnswerPlantScope(question,answer){
            const focused=naraPlantEntriesMentionedInText(question);
            const explicitCrops=naraExplicitCropTerms(question);
            const focusIds=new Set(focused.map(p=>String(p.id||p.name)));
            const clauses=String(answer||'').split(/[\n.!?;]+/).flatMap(s=>s.split(/\b(?:tetapi|namun|sedangkan)\b/i)).map(s=>s.trim()).filter(Boolean);
            const offending=new Set();
            for(const clause of clauses){
              const mentioned=naraPlantEntriesMentionedInText(clause).filter(p=>!focusIds.has(String(p.id||p.name)));
              if(!mentioned.length)continue;
              // Mere mention of another crop is not contamination. Flag only positive claims that
              // attribute recorded garden facts/events to that other plant.
              const policyOnly=/(?:\b(?:jangan|tidak|bukan|hindari|belum)\b[^.!?]{0,100}\b(?:gunakan|dipakai|dijadikan|menyimpulkan|membuktikan|bukti|fakta|menyamakan|menggabungkan)\b)|(?:\b(?:bukan bukti|tidak membuktikan|tidak boleh (?:menjadi|dijadikan)|tidak digunakan sebagai bukti|jangan menganggap)\b)/i.test(clause);
              const sourceAttribution=/(?:\bcatatan\b|\brekaman\b|\briwayat\b|\bdata kebun\b|\btercatat\b|\bterekam\b|\bmenurut catatan\b|\bberdasarkan catatan\b|\bberdasarkan data\b|\bdi catatan\b|\bhasil panen tercatat\b|\briwayat menunjukkan\b)/i.test(clause);
              const specificEvent=/(?:\b(?:kemarin|hari ini|minggu lalu|terakhir|pada tanggal|tanggal\s*\d+)\b[^.!?]{0,50}\b(?:disiram|dipanen|dipangkas|diberi pupuk|berbunga|berbuah)\b)|(?:\b(?:disiram|dipanen|dipangkas|diberi pupuk|berbunga|berbuah)\b[^.!?]{0,50}\b(?:kemarin|hari ini|minggu lalu|terakhir|pada tanggal|tanggal\s*\d+)\b)/i.test(clause);
              if((sourceAttribution||specificEvent)&&!policyOnly){
                for(const plant of mentioned)offending.add(String(plant.name||'tanaman lain'));
              }
            }
            const names=[...offending];
            if(names.length)return {ok:false,offending:names,mode:'other-plant-record-claim'};
            // If the user named a crop explicitly, general horticultural analysis is allowed even
            // when that crop has no matching garden record. A different crop mentioned only as
            // an example or as a warning is not itself a source-integrity failure.
            return {ok:true,offending:[],mode:focused.length?'record_scoped':(explicitCrops.length?'explicit_species_general_knowledge':'general')};
          }''')

          replace_function('naraPlantScopeSafeFallback', 'question', r'''function naraPlantScopeSafeFallback(question){
            const raw=String(question||'');
            const q=raw.toLocaleLowerCase('id-ID');
            const crops=naraExplicitCropTerms(raw);
            const records=naraPlantEntriesMentionedInText(raw);
            const crop=crops[0]||records[0]?.name||'tanaman yang kamu sebutkan';
            const asksEvidenceInventory=/(periksa|inventaris|daftar|audit|seluruh|semua|data apa|bukti apa|catatan apa)/i.test(raw)&&/(catatan|riwayat|rekaman|bukti|data kebun|observasi)/i.test(raw);
            const asksHarvestRelevance=/(hasil panen|catatan panen|riwayat panen|panen)/i.test(raw)&&/(membantu|relevan|menentukan|penyebab|bukti|hubungan|berkaitan|gunakan|dipakai)/i.test(raw);
            if(asksEvidenceInventory){
              const focusIds=new Set(records.map(p=>String(p.id||p.name)));
              const matched=records.length?records:data.filter(p=>p?.name&&crops.some(c=>naraMemoryTokens(p.name).includes(c)));
              const ids=new Set(matched.map(p=>String(p.id||p.name)));
              const plantRecords=matched.map(p=>`- Rekaman tanaman: ${p.name||'nama tidak tersedia'}; catatan: ${String(p.note||'tidak ada catatan tanaman yang tersimpan').slice(0,220)}.`);
              const issueRecords=attentions.filter(a=>ids.has(String(a.plantId))).slice(-5).map(a=>`- Perhatian tercatat (${a.date||'tanggal tidak tersedia'}): ${a.problemType||a.type||'jenis tidak tercatat'}; bagian: ${a.affectedPart||'tidak dicatat'}; catatan: ${String(a.note||'tidak ada rincian').slice(0,180)}.`);
              const harvestRecords=harvests.filter(h=>ids.has(String(h.plantId))).slice(-5).map(h=>`- Panen (${h.date||'tanggal tidak tersedia'}): ${h.qty??'jumlah tidak dicatat'} ${h.unit||''}; kualitas: ${h.quality||'tidak dicatat'}; catatan: ${String(h.note||'').slice(0,120)}.`);
              return `Audit bukti untuk ${matched.map(p=>p.name).join(', ')||crop}:\nBukti langsung yang tersedia:\n${[...plantRecords,...issueRecords].join('\n')||'- Tidak ditemukan rekaman tanaman/perhatian yang cocok pada konteks lokal yang dapat dipastikan.'}\nKonteks tidak langsung:\n${harvestRecords.join('\n')||'- Tidak ada catatan panen yang cocok ditemukan.'}\nBatasan: catatan panen menggambarkan produksi/waktu panen dan tidak membuktikan penyebab gejala. Aktivitas kebun umum tidak dianggap terkait kecuali ada kecocokan tanaman/lokasi/waktu. Informasi yang belum tersedia harus diperiksa langsung; jangan mengarang hasil pemeriksaan atau menyimpulkan penyebab tanpa bukti pendukung.`;
            }
            if(asksHarvestRelevance){
              const cropList=crops.length>1?crops.join(' dan '):(crops[0]||crop);
              return `Catatan panen ${cropList} dapat memberi konteks produksi dan waktu panen untuk tanaman yang tercatat, tetapi jumlah, kualitas, atau tanggal panen saja tidak membuktikan penyebab daun tomat menguning. Catatan panen tomat dapat menjadi konteks tidak langsung bila waktunya berhubungan dengan perubahan tanaman, tetapi tidak secara langsung menunjukkan apakah masalahnya penyiraman, drainase, nutrisi, hama, atau penyakit. Catatan panen terung tidak boleh dianggap sebagai bukti kondisi tomat. Untuk menyelidiki kasus tomat, cocokkan identitas tanaman dan tanggal, lalu periksa apakah daun tua atau muda yang lebih dulu menguning, pola menguning, kelembapan media dan drainase, serta tanda hama atau penyakit. Berdasarkan informasi yang ada, penyebab utama belum dapat ditentukan.`;
            }
            if(/menguning|kuning|yellowing/i.test(q)){
              return `Untuk tanaman ${crop}, daun menguning dapat memiliki beberapa kemungkinan umum, misalnya masalah penyiraman atau drainase, ketersediaan hara, stres lingkungan, atau hama dan penyakit bila ada tanda pendukung. Dari gejala yang disebutkan saja, penyebab utama di kebunmu belum bisa dipastikan. Periksa apakah daun tua atau muda yang lebih dulu menguning, apakah perubahan merata atau berupa bercak, kelembapan media dan drainase, serta bagian bawah daun. Ini pemeriksaan awal, bukan klaim bahwa pemeriksaan sudah dilakukan. Jangan langsung menambahkan pupuk atau pestisida tanpa bukti yang mendukung. Catatan tanaman lain tidak akan dipakai sebagai bukti untuk kasus ini.`;
            }
            if(/catatan|riwayat|bukti|relevan|membantu|menentukan|penyebab|hubungan/i.test(q)){
              return `Pertanyaanmu berkaitan dengan relevansi bukti atau catatan untuk ${crop}. Catatan hanya dapat mendukung kesimpulan jika identitas tanaman, waktu, dan jenis pengamatan cocok. Catatan tanaman lain tidak menjadi bukti langsung untuk ${crop}, dan pengetahuan umum hanya membantu menyusun hipotesis. Dari informasi yang tersedia, hubungan sebab-akibat belum dapat dipastikan. Sebutkan catatan spesifik yang ingin dibandingkan agar relevansinya bisa diperiksa tanpa mengarang hubungan.`;
            }
            return `Aku belum dapat memberi kesimpulan spesifik untuk pertanyaan ini berdasarkan konteks yang tersedia. Aku bisa memakai pengetahuan umum untuk menjelaskan kemungkinan, tetapi klaim tentang kebun harus didukung catatan atau observasi yang cocok dengan tanaman dan waktu yang dibahas. Aku tidak akan menganggap data tanaman lain sebagai bukti untuk ${crop}.`;
          }''')

          # If an answer still fails the factual cross-plant audit after retry, return a cautious useful
          # analysis rather than asking the user to repeat a plant name they have already supplied.
          old_refusal="return {text:'Aku mendeteksi risiko tercampurnya konteks antar tanaman dalam jawaban yang dihasilkan. Catatan tanaman lain tidak akan kugunakan sebagai fakta untuk kasus ini. Tolong berikan atau pilih rekaman tanaman yang tepat agar aku dapat menganalisis data kebun spesifiknya.',model:retry.model||response.model};"
          new_refusal="console.warn('Nara scope audit retained safe answer path after retry failed a factual source-attribution check.',secondAudit.offending||[]);return {text:naraPlantScopeSafeFallback(question),model:retry.model||response.model};"
          replace_once(old_refusal,new_refusal,'post-retry refusal fallback')

          # The prior Step 2B patch has already installed this exact catch fallback, so
          # anchor to its actual emitted text rather than a stale v37-era refusal string.
          old_catch="if(target){const fallback=target.localDraft||target.text;const audit=naraAuditAnswerPlantScope(raw,fallback);target.text=audit.ok?fallback:'Aku belum bisa memberikan jawaban yang aman karena berisiko mencampur catatan antar tanaman. Sebutkan tanaman atau catatan spesifik yang ingin diperiksa.';target.pending=false;target.onlineFailed=true;naraPersistState();naraRenderChat();}"
          new_catch="if(target){const fallback=target.localDraft||target.text;const audit=naraAuditAnswerPlantScope(raw,fallback);const hasOneFocus=naraExplicitCropTerms(raw).length===1||naraPlantEntriesMentionedInText(raw).length===1;target.text=audit.ok?fallback:(hasOneFocus?naraPlantScopeSafeFallback(raw):'Aku belum bisa memastikan fokus tanaman dengan aman. Sebutkan tanaman yang ingin diperiksa.');target.pending=false;target.onlineFailed=true;naraPersistState();naraRenderChat();}"
          replace_once(old_catch,new_catch,'local fallback behavior')

          checks={
            'history filters conflicting turns individually':'return items.filter(m=>{' in source and 'const mentioned=naraPlantEntriesMentionedInText(m?.text||m?.isi||\'\')' in source,
            'audit detects attributed garden-record claims rather than mere crop mentions':'other-plant-record-claim' in source and 'const sourceAttribution=' in source,
            'explicit crop allowed to use general knowledge':'explicit_species_general_knowledge' in source,
            'safe fallback does not claim that no record exists':'Dari gejala yang disebutkan saja' in source and 'belum bisa dipastikan' in source,
            'retry failure no longer blocks explicit plant analysis':'naraPlantScopeSafeFallback(question),model:retry.model||response.model' in source,
            'split user and teacher memory remains':'naraState.userLessons' in source and 'naraState.teacherLessons' in source and 'function naraLessonContextText' in source,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit('ERROR: Step 2I verification failed: '+', '.join(failed))
          if source==original: raise SystemExit('ERROR: Step 2I patch made no changes.')
          path.write_text(source,encoding='utf-8')
          print('Step 2I intent-aware fallback patch applied.')
          for name in checks: print('PASS:',name)
          PYTHON

      - name: Regression-test intent-aware fallback and context isolation (Nara Step 2I)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const html = fs.readFileSync('android/app/src/main/assets/index.html','utf8');
          const start = html.indexOf('function naraExplicitCropTerms(value){');
          const end = html.indexOf("function naraOnlineLearningContext(question,localDraft=''){",start);
          if(start<0||end<0||end<=start)throw new Error('Cannot isolate Nara plant-context helpers.');
          const context={
            data:[
              {id:'tomato-1',name:'Tomat Roma Bed A',note:'Daun bawah mulai menguning'},
              {id:'eggplant-1',name:'Terung Bulat Hijau Bergaris Putih',note:'Catatan tanaman terung'}
            ],
            attentions:[],
            harvests:[],
            naraMemoryTokens(value){return String(value||'').toLocaleLowerCase('id-ID').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);},
            console
          };
          vm.createContext(context); vm.runInContext(html.slice(start,end),context);
          const q='Daun tomat di kebunku mulai menguning';
          const factualSafe='Daun tomat bisa menguning karena beberapa kemungkinan. Catatan terung tidak boleh dijadikan bukti untuk tomat.';
          assert.strictEqual(context.naraAuditAnswerPlantScope(q,factualSafe).ok,true,'A cautionary mention of another plant must not fail audit.');
          const mixed='Catatan terung mencatat tanaman itu disiram kemarin; kondisi itu menjadi penyebab daun tomat menguning.';
          assert.strictEqual(context.naraAuditAnswerPlantScope(q,mixed).ok,false,'A claim importing another plant record must fail audit.');
          const scoped=context.naraScopeRecentHistory(q,[
            {role:'user',text:'Kasus terung menguning'},
            {role:'assistant',text:'Catatan terung perlu dipisahkan.'},
            {role:'user',text:'Baik, kita bahas gejala baru.'},
            {role:'user',text:'Daun tomat di kebun mulai menguning.'}
          ]);
          assert.strictEqual(scoped.length,2,'History should keep neutral and target-plant turns while dropping only the other-plant turns.');
          assert(scoped.some(m=>m.text.includes('gejala baru')),'Neutral context should remain.');
          assert(scoped.some(m=>m.text.includes('Daun tomat')),'Target-plant context should remain.');
          const fb=context.naraPlantScopeSafeFallback(q);
          assert(fb.includes('beberapa kemungkinan umum'),'Fallback must offer general possibilities.');
          assert(fb.includes('Dari gejala yang disebutkan saja')&&fb.includes('belum bisa dipastikan'),'Fallback must express uncertainty without claiming no record exists.');
          const harvestQuestion='Sebelumnya ada catatan hasil panen tomat dan terung di kebunku. Apakah catatan panen tersebut dapat membantumu menentukan penyebab daun tomat menguning sekarang?';
          const harvestFallback=context.naraPlantScopeSafeFallback(harvestQuestion);
          assert(harvestFallback.includes('Catatan panen'),'Fallback must answer harvest-record relevance questions, not repeat a leaf-yellowing template.');
          assert(harvestFallback.includes('tidak membuktikan penyebab'),'Harvest counts and quality must not be treated as proof of yellowing cause.');
          assert(harvestFallback.includes('Catatan panen terung tidak boleh dianggap sebagai bukti kondisi tomat'),'Other-plant harvest records must remain isolated.');
          assert(!harvestFallback.includes('Periksa apakah daun tua atau muda yang lebih dulu menguning'),'Harvest-relevance question must not receive the symptom-only fallback.');
          const inventoryQuestion='Periksa seluruh catatan kebun yang relevan untuk tanaman tomat. Data apa yang tersedia sebagai bukti langsung, konteks tidak langsung seperti panen, dan informasi yang belum tersedia?';
          const inventoryFallback=context.naraPlantScopeSafeFallback(inventoryQuestion);
          assert(inventoryFallback.includes('Audit bukti'),'Evidence inventory intent must receive a structured evidence audit.');
          assert(inventoryFallback.includes('Bukti langsung yang tersedia')&&inventoryFallback.includes('Konteks tidak langsung'),'Evidence audit must distinguish direct evidence from indirect context.');
          assert(inventoryFallback.includes('tidak membuktikan penyebab'),'Harvest records must not be presented as proof of symptom causation.');
          console.log('PASS: fallback follows evidence-inventory intent');
          console.log('PASS: evidence audit separates direct and indirect context');
          console.log('PASS: fallback follows harvest-record question intent');
          console.log('PASS: harvest data not falsely treated as causal proof');
          console.log('PASS: cross-plant record separation preserved');
          console.log('PASS: cautionary cross-plant mention allowed');
          console.log('PASS: positive cross-plant garden-record claim blocked');
          console.log('PASS: history filters only conflicting plant turns');
          console.log('PASS: safe fallback remains useful and uncertainty-aware');
          NODE

      - name: Track Nara answer provenance in chat (Nara Step 2M)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          path = Path('android/app/src/main/assets/index.html')
          source = path.read_text(encoding='utf-8')
          original = source

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: Step 2L patch stopped at {label}: expected one exact anchor, found {count}. Refusing an ambiguous patch.')
              source = source.replace(old, new, 1)

          # Tag each return route independently inside naraRequestOnlineAnswer.
          # Do not rely on a multi-line anchor whose indentation can change in prior steps.
          fn_start = source.find('async function naraRequestOnlineAnswer(')
          fn_end = source.find('\nfunction naraBuildTeacherPrompt(', fn_start + 1)
          if fn_start < 0 or fn_end <= fn_start:
              raise SystemExit('ERROR: Step 2L cannot isolate naraRequestOnlineAnswer safely.')
          fn = source[fn_start:fn_end]

          def tag_function_return(body: str, statement: str, replacement: str, label: str) -> str:
              pattern = re.compile(rf'(?m)^([ \t]*)return {re.escape(statement)};[ \t]*$')
              matches = list(pattern.finditer(body))
              if len(matches) != 1:
                  raise SystemExit(f'ERROR: Step 2L {label}: expected one return statement in naraRequestOnlineAnswer, found {len(matches)}.')
              match = matches[0]
              line = f"{match.group(1)}return {{...{statement},answerSource:'{replacement[0]}',answerAudit:'{replacement[1]}'}};"
              return body[:match.start()] + line + body[match.end():]

          fn = tag_function_return(fn, 'retry', ('online_revised','passed_after_retry'), 'retry route provenance')
          fn = tag_function_return(fn, 'response', ('online_direct','passed_first_audit'), 'direct route provenance')
          source = source[:fn_start] + fn + source[fn_end:]

          # Both branches that substitute the intent-aware safe template must be labelled as fallback,
          # not as a direct answer from the model that supplied the previous response.
          old_fallback = "return {text:naraPlantScopeSafeFallback(question),model:retry.model||response.model};"
          fallback_count = source.count(old_fallback)
          if fallback_count < 1:
              raise SystemExit('ERROR: Step 2L could not find the safe-template return path to label.')
          source = source.replace(old_fallback, "return {text:naraPlantScopeSafeFallback(question),model:retry.model||response.model,answerSource:'safe_fallback',answerAudit:'response_rejected_after_retry'};")

          scope_guard_old = "return {text:'Aku mendeteksi risiko tercampurnya konteks antar tanaman dalam jawaban yang dihasilkan. Catatan tanaman lain tidak akan kugunakan sebagai fakta untuk kasus ini. Tolong berikan atau pilih rekaman tanaman yang tepat agar aku dapat menganalisis data kebun spesifiknya.',model:retry.model||response.model};"
          scope_guard_new = "return {text:'Aku mendeteksi risiko tercampurnya konteks antar tanaman dalam jawaban yang dihasilkan. Catatan tanaman lain tidak akan kugunakan sebagai fakta untuk kasus ini. Tolong berikan atau pilih rekaman tanaman yang tepat agar aku dapat menganalisis data kebun spesifiknya.',model:retry.model||response.model,answerSource:'scope_guard',answerAudit:'failed_after_retry'};"
          scope_guard_count = source.count(scope_guard_old)
          if scope_guard_count > 1:
              raise SystemExit(f'ERROR: Step 2L found ambiguous scope-guard paths: {scope_guard_count}.')
          if scope_guard_count == 1:
              source = source.replace(scope_guard_old, scope_guard_new, 1)

          # The online request can fail entirely; preserve a truthful label for the local/template response.
          catch_old = "target.text=audit.ok?fallback:(hasOneFocus?naraPlantScopeSafeFallback(raw):'Aku belum bisa memastikan fokus tanaman dengan aman. Sebutkan tanaman yang ingin diperiksa.');target.pending=false;target.onlineFailed=true;naraPersistState();naraRenderChat();}"
          catch_new = "target.text=audit.ok?fallback:(hasOneFocus?naraPlantScopeSafeFallback(raw):'Aku belum bisa memastikan fokus tanaman dengan aman. Sebutkan tanaman yang ingin diperiksa.');target.answerSource='local_fallback';target.answerAudit='online_request_failed';target.pending=false;target.onlineFailed=true;naraPersistState();naraRenderChat();}"
          replace_once(catch_old, catch_new, 'online-request error fallback provenance')

          # Distinguish pending/local-rule messages from the eventual online result.
          replace_once(
              "const answerMessage={id:makeId('nara-answer'),role:'assistant',text:localAnswer,localDraft:localAnswer,createdAt:new Date().toISOString(),pending:useOnline,onlineFailed:false};",
              "const answerMessage={id:makeId('nara-answer'),role:'assistant',text:localAnswer,localDraft:localAnswer,createdAt:new Date().toISOString(),pending:useOnline,onlineFailed:false,answerSource:useOnline?'pending_online':'local_rules'};",
              'pending and local-rule message provenance'
          )
          replace_once(
              "target.onlineModel=result.model;target.pending=false;target.onlineFailed=false;",
              "target.onlineModel=result.model;target.answerSource=result.answerSource||result.source||'online_unclassified';target.answerAudit=result.answerAudit||'';target.pending=false;target.onlineFailed=false;",
              'store response provenance on chat message'
          )

          # Show the route/audit state in the existing message metadata without exposing prompts or internal text.
          source_helper = r'''function naraAnswerSourceLabel(m){
            const source=String(m?.answerSource||'');
            if(m?.pending||source==='pending_online')return 'Menjawab dengan Guru Online…';
            if(source==='local_rules')return 'Jawaban lokal berbasis aturan';
            if(source==='online_unclassified')return `AI online · sumber/jalur belum terklasifikasi · ${m.onlineModel||NARA_GURU_MODEL}`;
            if(source==='online_direct')return `AI online · lolos audit konteks awal · ${m.onlineModel||NARA_GURU_MODEL}`;
            if(source==='online_revised')return `AI online · revisi lolos audit konteks · ${m.onlineModel||NARA_GURU_MODEL}`;
            if(source==='safe_fallback')return 'Jawaban cadangan Nara · respons AI tidak lolos audit konteks';
            if(source==='scope_guard')return 'Jawaban ditahan oleh audit konteks';
            if(source==='local_fallback'||m?.onlineFailed)return 'Jawaban lokal sederhana · permintaan AI online gagal';
            if(m?.onlineModel)return `AI online · ${m.onlineModel}`;
            return '';
          }
          '''
          replace_once('function naraRenderChat(){', source_helper + 'function naraRenderChat(){', 'answer source label helper')
          old_meta_source = "m.pending?'Menjawab dengan Guru Online…':m.onlineModel?m.onlineModel:m.onlineFailed?'Jawaban lokal · Guru Online belum tersambung':''"
          replace_once(old_meta_source, 'naraAnswerSourceLabel(m)', 'visible answer provenance label')

          checks = {
              'direct AI answers tagged after first context audit': "answerSource:'online_direct',answerAudit:'passed_first_audit'" in source,
              'retried AI answers tagged after second context audit': "answerSource:'online_revised',answerAudit:'passed_after_retry'" in source,
              'safe template paths labelled as fallback': "answerSource:'safe_fallback',answerAudit:'response_rejected_after_retry'" in source and fallback_count >= 1,
              'network failure path labelled separately': "target.answerSource='local_fallback';target.answerAudit='online_request_failed'" in source,
              'scope-guard route is labelled if retained': ("return {text:'Aku mendeteksi risiko tercampurnya konteks antar tanaman dalam jawaban yang dihasilkan" not in source or "answerSource:'scope_guard',answerAudit:'failed_after_retry'" in source),
              'unclassified response is not falsely labelled as passed audit': "target.answerSource=result.answerSource||result.source||'online_unclassified'" in source and "if(source==='online_unclassified')return" in source,
              'chat renders provenance labels': 'function naraAnswerSourceLabel(m)' in source and 'naraAnswerSourceLabel(m)' in source,
              'context audit and source isolation remain': 'function naraAuditAnswerPlantScope' in source and 'function naraScopeRecentHistory' in source,
              # Candidate/validated stores are installed by later Step 2C/2E stages and checked by the final gate.
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('ERROR: Step 2L post-patch checks failed: ' + ', '.join(failed))
          if source == original:
              raise SystemExit('ERROR: Step 2L patch made no source changes.')
          path.write_text(source, encoding='utf-8')
          print('Step 2L answer provenance patch applied.')
          for name in checks:
              print('PASS:', name)
          PYTHON

