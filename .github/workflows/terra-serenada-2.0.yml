name: Terra Serenada 2.0

# Manual fallback retained; the 2.1 workflow is the only automatic APK build for index.html.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terra-serenada-2-0-apk-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, verify, and publish Terra Serenada 2.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BASELINE_APK_URL: https://github.com/terra-serenada/Terra-Serenada/releases/download/apk-v1.0.19-10/Terra-Serenada.apk

    steps:
      - name: Checkout complete history for the locked Step 2P checkpoint
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build from the locked Step 2P checkpoint and run its safety checks
        shell: bash
        env:
          LEGACY_STEP2P_COMMIT: 9eb8456e93e8327abd8afcce4898313658c4c41c
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          git show "$LEGACY_STEP2P_COMMIT:.github/workflows/build-apk-v51-restored-step2p.yml" > "$RUNNER_TEMP/legacy-step2p.yml"
          git show "$LEGACY_STEP2P_COMMIT:.github/workflows/build-apk-v26.yml" > .github/workflows/build-apk-v26.yml
          test -s "$RUNNER_TEMP/legacy-step2p.yml"
          test -s .github/workflows/build-apk-v26.yml
          ruby -ryaml - <<'RUBY'
          require 'yaml'

          legacy_path = File.join(ENV.fetch('RUNNER_TEMP'), 'legacy-step2p.yml')
          workflow = YAML.safe_load_file(legacy_path, aliases: true)
          steps = workflow.fetch('jobs').fetch('build-and-publish').fetch('steps')
          first = steps.index { |s| s['name'] == 'Create Android project from the known-good v26 generator (no repository push)' }
          last = steps.index { |s| s['name'] == 'Android emulator install and launch smoke test' }
          abort 'ERROR: The locked Step 2P build steps could not be located.' unless first && last && first < last

          steps[first...last].each do |step|
            next unless step['run']
            name = step.fetch('name', 'Unnamed legacy build step')
            command = step.fetch('run').dup

            # Give the new workflow a safely higher Android versionCode while retaining
            # the Step 2P HTML, evidence gates, diagnostics, and regression checks.
            if name == 'Set monotonically newer application version'
              command.sub!('new_code = "versionCode = 30000 + ciRunNumber"', 'new_code = "versionCode = 1000000 + ciRunNumber"')
              command.sub!(%q{new_name = 'versionName = "1.0.45.$ciRunNumber"'}, %q{new_name = 'versionName = "2.0.$ciRunNumber"'})
            elsif name == 'Verify candidate gate, validated-only retrieval, and online-first configuration'
              command.gsub!('versionCode = 30000 + ciRunNumber', 'versionCode = 1000000 + ciRunNumber')
              command.gsub!('versionName = "1.0.45.$ciRunNumber"', 'versionName = "2.0.$ciRunNumber"')
            elsif name == 'Validate APK archive, signing certificate, metadata and alignment'
              command.gsub!('expected_code=$((30000 + GITHUB_RUN_NUMBER))', 'expected_code=$((1000000 + GITHUB_RUN_NUMBER))')
              command.gsub!('expected_name="1.0.45.${GITHUB_RUN_NUMBER}"', 'expected_name="2.0.${GITHUB_RUN_NUMBER}"')
            end

            puts "::group::#{name}"
            ok = system(
              {
                'KEYSTORE_B64' => ENV.fetch('KEYSTORE_B64', ''),
                'KEYSTORE_PASSWORD' => ENV.fetch('KEYSTORE_PASSWORD', ''),
                'BASELINE_APK_URL' => ENV.fetch('BASELINE_APK_URL')
              },
              'bash', '-euo', 'pipefail', '-c', command
            )
            puts '::endgroup::'
            abort "ERROR: Build step failed: #{name}" unless ok

            # GitHub normally imports GITHUB_ENV after every run step. Because this
            # compact dispatcher executes the locked run blocks in sequence, import
            # the simple KEY=VALUE entries between blocks to preserve that behavior.
            env_file = ENV['GITHUB_ENV']
            if env_file && File.file?(env_file)
              File.foreach(env_file) do |line|
                line = line.chomp
                next unless line.match?(/\A[A-Za-z_][A-Za-z0-9_]*=/)
                key, value = line.split('=', 2)
                ENV[key] = value
              end
            end
          end
          RUBY

      - name: Android emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            bash -c 'set -euo pipefail; adb wait-for-device; adb install -r Terra-Serenada.apk; adb logcat -c; adb shell monkey -p com.terra.serenada -c android.intent.category.LAUNCHER 1; app_pid=""; for attempt in $(seq 1 30); do app_pid="$(adb shell pidof com.terra.serenada 2>/dev/null || true)"; if [ -n "$app_pid" ]; then break; fi; sleep 1; done; if [ -z "$app_pid" ]; then echo "ERROR: Terra Serenada did not remain running after launch. Android runtime logs follow:"; adb logcat -d -s AndroidRuntime:E ActivityManager:E || true; exit 1; fi; crash_log="$(adb logcat -d -s AndroidRuntime:E 2>&1)" || { echo "ERROR: Unable to read Android runtime logs after launching the app."; exit 1; }; if printf "%s\n" "$crash_log" | grep -q "FATAL EXCEPTION"; then printf "%s\n" "$crash_log"; exit 1; fi; echo "APK installed and app process remained running in Android emulator."'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Serenada-APK-2.0-${{ github.run_number }}
          path: Terra-Serenada.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terra-serenada-2.0-${{ github.run_number }}
          name: Terra Serenada APK 2.0 (build ${{ github.run_number }})
          body: |
            Terra Serenada 2.0 build based on the locked Nara Step 2P checkpoint.
            Includes retrieval diagnostics, answer provenance, candidate/validated lesson separation,
            correction-aware fallback, and context/source validation from the Step 2P workflow.
            Existing garden records and taught knowledge are not intentionally cleared.
            Publishing is gated by source checks, matching APK signing certificate, APK metadata/alignment,
            and Android emulator installation/launch smoke testing.
