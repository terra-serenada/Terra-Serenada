          from pathlib import Path
          p = Path("android/app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          if "AndroidBridge.saveBackup" not in s and "buildBackupJson" not in s:
              raise SystemExit("HTML backup bridge marker not found; refusing to build an incompatible APK.")
          old = "async function requestNotifications(){if(!('Notification' in window)){showToast('Browser ini tidak mendukung notifikasi');return false}const p=await Notification.requestPermission();if(p==='granted'){showToast('Notifikasi diaktifkan');scheduleNotifications();return true}showToast('Izin notifikasi belum diberikan');return false}"
          new = "async function requestNotifications(){if(window.AndroidBridge&&typeof window.AndroidBridge.requestNotifications==='function'){window.AndroidBridge.requestNotifications();showToast('Permintaan izin notifikasi dibuka');scheduleNotifications();return true}if(!('Notification' in window)){showToast('Browser ini tidak mendukung notifikasi');return false}const p=await Notification.requestPermission();if(p==='granted'){showToast('Notifikasi diaktifkan');scheduleNotifications();return true}showToast('Izin notifikasi belum diberikan');return false}"
          if "AndroidBridge.requestNotifications" not in s:
              if old not in s:
                  raise SystemExit("Native notification function not found; cannot connect Android permission bridge safely.")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PYTHON
          python3 .github/scripts/patch_nara_local_index.py android/app/src/main/assets/index.html
          grep -q 'naraNativeModelBtn' android/app/src/main/assets/index.html
          grep -q 'window.__naraSetNativeStatus' android/app/src/main/assets/index.html

      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/terra-serenada-release.p12"
          test -s "$RUNNER_TEMP/terra-serenada-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/terra-serenada-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=terra-serenada" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify compiler and runtime versions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'org.jetbrains.kotlin.android.*2.4.21' android/build.gradle.kts
          grep -q 'litertlm-android:0.18.0' android/app/build.gradle.kts
          grep -q 'jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)' android/app/build.gradle.kts
          if grep -q 'kotlinOptions { jvmTarget' android/app/build.gradle.kts; then
            echo "ERROR: Legacy Kotlin jvmTarget DSL must not be present with Kotlin 2.4.21."
            exit 1
          fi
          grep -q 'val conn = (URL(RECOMMENDED_MODEL_URL)' android/app/src/main/java/com/terra/serenada/NaraLocalEngine.kt
          echo "Kotlin compiler and LiteRT-LM versions plus compilerOptions DSL are aligned."

      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Check generated APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Terra-Serenada.apk
          test -s Terra-Serenada.apk
          ls -lh Terra-Serenada.apk

      - name: Upload APK artifact (temporary download)
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Serenada-APK-Offline-${{ github.run_number }}
          path: Terra-Serenada.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.20-${{ github.run_number }}
          name: Terra Serenada APK 1.0.20 (build ${{ github.run_number }})
          body: |
            Terra Serenada dengan bridge inferensi lokal Nara berbasis LiteRT-LM.

            Model .litertlm diimpor satu kali ke penyimpanan privat aplikasi. Setelah model berhasil dimuat, inferensi dapat berlangsung offline. Unduhan model tetap perlu diperoleh dari sumber berlisensi dan kompatibel.
            Build CI memvalidasi kompilasi; pengujian inferensi akhir dilakukan di perangkat Android menggunakan tombol Uji model lokal.
          files: Terra-Serenada.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
