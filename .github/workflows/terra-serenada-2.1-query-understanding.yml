name: Terra Serenada 2.1 — Nara Query Understanding

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terra-serenada-2.1-query-understanding.yml"
      - "index.html"
      - ".github/scripts/test_nara_group_history_direct.js"
      - ".github/scripts/test_nara_query_understanding.js"

permissions:
  contents: write

concurrency:
  group: terra-serenada-2-1-query-understanding
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and verify Nara Query Understanding APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BASELINE_APK_URL: https://github.com/terra-serenada/Terra-Serenada/releases/download/apk-v1.0.19-10/Terra-Serenada.apk
      LEGACY_GENERATOR_COMMIT: 9eb8456e93e8327abd8afcce4898313658c4c41c

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create Android project from the pinned known-good generator
        shell: bash
        run: |
          set -euo pipefail
          git show "$LEGACY_GENERATOR_COMMIT:.github/workflows/build-apk-v26.yml" > "$RUNNER_TEMP/build-apk-v26.yml"
          ruby -ryaml -e '
            workflow = YAML.safe_load_file(ARGV.fetch(0), aliases: true)
            steps = workflow.fetch("jobs").values.first.fetch("steps")
            step = steps.find { |item| item["name"] == "Create Android project (preserve the existing Terra Serenada bridges)" }
            abort "ERROR: The pinned Android project generator was not found." unless step && step["run"]
            File.write(ARGV.fetch(1), step["run"])
          ' "$RUNNER_TEMP/build-apk-v26.yml" "$RUNNER_TEMP/create-android-project.sh"
          test -s "$RUNNER_TEMP/create-android-project.sh"
          bash "$RUNNER_TEMP/create-android-project.sh"
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/java/com/terra/serenada/MainActivity.java
          echo "Android project generated without changing or pushing repository files."

      - name: Set the next compatible 2.1 application version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          old_code = "versionCode = 1000 + ciRunNumber"
          new_code = "versionCode = 1100000 + ciRunNumber"
          old_name = 'versionName = "1.0.21.$ciRunNumber"'
          new_name = 'versionName = "2.1.$ciRunNumber"'
          if s.count(old_code) != 1 or s.count(old_name) != 1:
              raise SystemExit("ERROR: Could not safely update application version metadata.")
          p.write_text(s.replace(old_code, new_code, 1).replace(old_name, new_name, 1), encoding="utf-8")
          print("Version configured: versionCode 1100000 + workflow run number; versionName 2.1.<run>.")
          PYTHON

      - name: Install the merged root HTML source directly
        shell: bash
        run: |
          set -euo pipefail
          source_file="index.html"
          asset_file="android/app/src/main/assets/index.html"
          test -s "$source_file"
          test -s "$asset_file"
          cp "$source_file" "$asset_file"
          cmp -s "$source_file" "$asset_file"
          echo "PASS: APK asset is byte-for-byte identical to root index.html"
          sha256sum "$source_file" "$asset_file"

      - name: Verify direct-source features and preserved safeguards
        shell: bash
        run: |
          set -euo pipefail
          html="android/app/src/main/assets/index.html"
          grep -q 'async function naraRequestOnlineAnswer' "$html"
          grep -Eq "const NARA_GURU_MODEL='[^']+'" "$html"
          grep -q 'model:NARA_GURU_MODEL' "$html"
          grep -q 'function naraGuruErrorMessage(payload,status,rawBody=' "$html"
          grep -q 'function naraInterpretUserQuery(question,localDraft=' "$html"
          grep -q "intent='status_kelompok_tanam'" "$html"
          grep -q 'ringkasan_pencarian_kelompok_tanam:groupSearchCounts' "$html"
          grep -q 'jumlah_gagal:groupFailedQty(g)' "$html"
          grep -q 'tanggal_status_dicatat:exactStatusDate' "$html"
          grep -q 'aturan_status_kelompok_tanam:statusGroupIntent?' "$html"
          grep -q 'kelompok_tidak_dikirim' "$html"
          grep -q 'const trimStatusGroupEvidence=(maxPlants,maxGroups)=>' "$html"
          grep -q 'next.statusUpdatedOn=today();next.statusUpdatedAt=new Date().toISOString();' "$html"
          grep -q 'function naraRunRetrievalDiagnostic()' "$html"
          grep -q 'naraLastRetrievalAudit={' "$html"
          grep -Eq "answerSource:'online_direct',answerAudit:'(scope_only_passed|passed_first_audit)'" "$html"
          grep -q "answerSource:'online_revised',answerAudit:'passed_after_retry'" "$html"
          grep -q "answerSource:'safe_fallback',answerAudit:'response_rejected_after_retry'" "$html"
          grep -q 'function naraAnswerSourceLabel(m)' "$html"
          grep -q 'function naraAuditAnswerPlantScope' "$html"
          grep -q 'pedoman_sumber_dan_kasus' "$html"
          grep -q 'PENGUNCI IDENTITAS KASUS' "$html"
          grep -q 'PENGUNCI KASUS WAJIB' "$html"
          grep -q 'function naraLessonContextText' "$html"
          grep -q 'naraState.userLessons' "$html"
          grep -q 'naraState.teacherValidatedLessons' "$html"
          grep -q 'function naraValidateTeacherCandidate' "$html"
          grep -q 'nara_three_case_review_v1' "$html"
          grep -q 'const TS_PLANT_ROLES=' "$html"
          grep -q 'const TS_INHABITANT_ROLES=' "$html"
          grep -q 'katalog_role_kebun:' "$html"
          grep -q 'katalog_tanaman_role:' "$html"
          grep -q 'ringkasan_role_tanaman:' "$html"
          grep -q 'katalog_inhabitant_role:' "$html"
          grep -q 'ringkasan_role_inhabitant:' "$html"
          grep -q 'katalog_bed_hubungan:' "$html"
          grep -q 'AKSES ROLE DAN HUBUNGAN KEBUN:' "$html"
          if grep -q 'naraState.teacherLessons.push' "$html"; then
            echo 'ERROR: Guru lessons are still written directly into an unvalidated retrieval store.'
            exit 1
          fi
          echo "PASS: direct HTML contains status-history retrieval and preserves provenance, memory-validation, and answer-audit safeguards."

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)
          checked = 0
          with tempfile.TemporaryDirectory(prefix="nara-js-check-") as td:
              for i, (attrs, body) in enumerate(blocks):
                  match = re.search(r"type\s*=\s*[\"']?([^\"'\s>]+)", attrs, re.I)
                  if match and match.group(1).lower() not in ("text/javascript", "application/javascript", "module", "text/ecmascript", "application/ecmascript"):
                      continue
                  if not body.strip():
                      continue
                  script = Path(td) / f"script-{i}.js"
                  script.write_text(body, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(script)], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f"ERROR: JavaScript syntax check failed for inline block {i}.")
                  checked += 1
          if not checked:
              raise SystemExit("ERROR: No inline JavaScript block was checked.")
          print(f"PASS: JavaScript syntax valid in {checked} inline script block(s).")
          PYTHON

      - name: Test Anoman upstream error diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const html = fs.readFileSync('android/app/src/main/assets/index.html', 'utf8');
          const start = html.indexOf('function naraGuruErrorMessage(payload,status,rawBody=');
          const end = html.indexOf('\nasync function naraGuruChat(', start);
          if (start < 0 || end <= start) throw new Error('Could not isolate the provider error parser.');
          const context = {};
          vm.runInNewContext(html.slice(start, end), context, {timeout: 1000});
          let message = context.naraGuruErrorMessage({error:{type:'billing_error',code:'token_quota_exceeded',message:'Monthly token cap reached',model_tier_class:'budget',window:'monthly'}}, 402);
          assert.match(message, /HTTP 402/);
          assert.match(message, /kuota token/i);
          assert.match(message, /budget, monthly/i);
          assert.match(message, /Monthly token cap reached/);
          message = context.naraGuruErrorMessage({error:{type:'billing_error',code:'budget_exceeded',message:'Monthly budget exhausted'}}, 402);
          assert.match(message, /budget bulanan/i);
          message = context.naraGuruErrorMessage({detail:{error:'insufficient_credits',message:'Prepaid balance exhausted'}}, 402);
          assert.match(message, /kredit prabayar/i);
          message = context.naraGuruErrorMessage({error:'upstream failed',upstreamResponse:{status:402,body:{error:{code:'token_quota_exceeded',message:'Class cap reached',model_tier_class:'budget',window:'weekly'}}}}, 402);
          assert.match(message, /kuota token/i);
          assert.match(message, /weekly/i);
          message = context.naraGuruErrorMessage(null, 402, '');
          assert.match(message, /Usage\/Billing\/Quota/);
          message = context.naraGuruErrorMessage({error:{message:'Temporarily unavailable'}}, 503);
          assert.match(message, /HTTP 503/);
          console.log('PASS: Anoman 402 quota, budget, and credit errors are classified');
          console.log('PASS: nested Worker/upstream error bodies are parsed');
          console.log('PASS: generic HTTP failures retain actionable diagnostics');
          NODE

      - name: Load production role helpers into query regression VM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path

          p = Path(".github/scripts/test_nara_query_understanding.js")
          source = p.read_text(encoding="utf-8")
          marker = "const interpreter = html.slice(start, end);"

          if source.count(marker) != 1:
              raise SystemExit("ERROR: Could not safely locate interpreter extraction.")

          if "const roleHelperSource = [" not in source:
              role_block = r"""
          const extractTopLevelDeclaration = name => {
            const prefixes = [
              'function ' + name + '(',
              'async function ' + name + '(',
              'const ' + name + '=',
              'const ' + name + ' =',
              'let ' + name + '=',
              'let ' + name + ' =',
              'var ' + name + '=',
              'var ' + name + ' ='
            ];
            const matches = prefixes
              .map(prefix => ({prefix, index: html.indexOf(prefix)}))
              .filter(match => match.index >= 0)
              .sort((a, b) => a.index - b.index);

            if (!matches.length) {
              throw new Error('Could not find production declaration for ' + name + '.');
            }

            const {prefix, index: start} = matches[0];
            const after = start + prefix.length;
            const nextMarkers = [
              '\nasync function ',
              '\nfunction ',
              '\nconst ',
              '\nlet ',
              '\nvar '
            ];
            const ends = nextMarkers
              .map(nextMarker => html.indexOf(nextMarker, after))
              .filter(index => index >= 0);
            const end = ends.length ? Math.min(...ends) : html.length;
            const declaration = html.slice(start, end).trim();
            if (!declaration) {
              throw new Error('Extracted an empty production declaration for ' + name + '.');
            }
            return declaration;
          };

          const roleHelperSource = [
            'TS_PLANT_ROLES',
            'TS_INHABITANT_ROLES',
            'naraRequestedRoleCategory'
          ].map(extractTopLevelDeclaration).join('\n');
          """
              source = source.replace(marker, marker + "\n" + role_block, 1)

          old_call = r"vm.runInContext(interpreter + '\n' + plantHelpers + '\n' + correctionHelpers + '\n' + auditHelpers, context, {timeout:1000});"
          new_call = r"vm.runInContext(roleHelperSource + '\n' + interpreter + '\n' + plantHelpers + '\n' + correctionHelpers + '\n' + auditHelpers, context, {timeout:1000});"

          if source.count(old_call) != 1:
              raise SystemExit("ERROR: Could not safely locate regression VM evaluation call.")

          source = source.replace(old_call, new_call, 1)
          p.write_text(source, encoding="utf-8")
          print("PASS: role catalogs and naraRequestedRoleCategory are loaded into the regression VM.")
          PYTHON
          node --check .github/scripts/test_nara_query_understanding.js
          echo "PASS: patched query regression harness passes Node syntax validation."

      - name: Run Nara query-understanding regression tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/test_nara_query_understanding.js

      - name: Run synthetic historical-group retrieval tests
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/test_nara_group_history_direct.js android/app/src/main/assets/index.html

      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/terra-serenada-release.p12"
          test -s "$RUNNER_TEMP/terra-serenada-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/terra-serenada-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=terra-serenada" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for validation
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Terra-Serenada.apk
          test -s Terra-Serenada.apk
          ls -lh Terra-Serenada.apk
          sha256sum Terra-Serenada.apk

      - name: Validate APK signing, package identity, version, archive, and alignment
        shell: bash
        env:
          BASELINE_APK_URL: https://github.com/terra-serenada/Terra-Serenada/releases/download/apk-v1.0.19-10/Terra-Serenada.apk
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$ZIPALIGN" && test -x "$AAPT"
          curl --fail --location --retry 3 --silent --show-error "$BASELINE_APK_URL" --output baseline.apk
          test -s baseline.apk && test -s Terra-Serenada.apk
          unzip -t Terra-Serenada.apk
          "$APKSIGNER" verify --verbose --print-certs baseline.apk 2>&1 | tee baseline-signature.txt
          "$APKSIGNER" verify --verbose --print-certs Terra-Serenada.apk 2>&1 | tee new-signature.txt
          extract_certificate_sha256() {
            local signature_file="$1"
            awk '/certificate SHA-256 digest:/ { sub(/^.*certificate SHA-256 digest:[[:space:]]*/, ""); print; exit }' "$signature_file" \
              | tr -d ':' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]'
          }
          baseline_fingerprint="$(extract_certificate_sha256 baseline-signature.txt)"
          new_fingerprint="$(extract_certificate_sha256 new-signature.txt)"
          if [ -z "$baseline_fingerprint" ] || [ -z "$new_fingerprint" ]; then
            echo "ERROR: Unable to extract APK certificate SHA-256 fingerprint."
            grep -Ei 'certificate DN|certificate SHA-256 digest|Number of signers|Verified using' baseline-signature.txt new-signature.txt || true
            exit 1
          fi
          if [ "$baseline_fingerprint" != "$new_fingerprint" ]; then
            echo "ERROR: APK certificate differs from installed release; publishing is blocked."
            exit 1
          fi
          "$ZIPALIGN" -c -v 4 Terra-Serenada.apk
          "$AAPT" dump badging Terra-Serenada.apk | tee apk-metadata.txt
          expected_code=$((1100000 + GITHUB_RUN_NUMBER))
          expected_name="2.1.${GITHUB_RUN_NUMBER}"
          grep -F "package: name='com.terra.serenada' versionCode='${expected_code}' versionName='${expected_name}'" apk-metadata.txt
          echo "PASS: APK package, version, signature, archive, and alignment checks."

      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Serenada-APK-2.1-${{ github.run_number }}
          path: Terra-Serenada.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enable KVM permissions for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/udev/rules.d
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            bash -c 'set -euo pipefail; adb wait-for-device; adb install -r Terra-Serenada.apk; adb logcat -c; adb shell monkey -p com.terra.serenada -c android.intent.category.LAUNCHER 1; app_pid=""; for attempt in $(seq 1 30); do app_pid="$(adb shell pidof com.terra.serenada 2>/dev/null || true)"; if [ -n "$app_pid" ]; then break; fi; sleep 1; done; if [ -z "$app_pid" ]; then echo "ERROR: Terra Serenada did not remain running after launch. Android runtime logs follow:"; adb logcat -d -s AndroidRuntime:E ActivityManager:E || true; exit 1; fi; crash_log="$(adb logcat -d -s AndroidRuntime:E 2>&1)" || { echo "ERROR: Unable to read Android runtime logs after launching the app."; exit 1; }; if printf "%s\n" "$crash_log" | grep -q "FATAL EXCEPTION"; then printf "%s\n" "$crash_log"; exit 1; fi; echo "PASS: APK installed and app process remained running in Android emulator."'

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-terra-serenada-2.1-${{ github.run_number }}
          name: Terra Serenada APK 2.1 (build ${{ github.run_number }})
          body: |
            Terra Serenada 2.1 — merged root index.html as the single HTML source.
            Includes intent-aware group status/history retrieval, traceable per-group evidence,
            explicit status-update dates for future edits, retrieval diagnostics, answer provenance,
            and existing Nara query, memory-validation, and answer-audit safeguards.
            The repository root index.html is copied byte-for-byte into the APK; there is no separate nara-apk-source.html dependency.
            Publishing is gated by direct-source checks, regression tests, APK metadata/signature/alignment,
            and Android emulator installation/launch smoke testing.
