name: Build and publish APK v1.0.22 — Terra Serenada + Nara Offline (v27)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk-v27.yml"

permissions:
  contents: write

concurrency:
  group: terra-serenada-apk-release-v27
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, validate, install-test and publish APK v27
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create Android project from the known-good v26 generator (no repository push)
        shell: bash
        run: |
          set -euo pipefail
          # Generate the project in this runner only. Never commit or push from a build job;
          # doing so can race with user uploads and cause non-fast-forward failures.
          ruby -ryaml -e '
            workflow = YAML.safe_load_file(".github/workflows/build-apk-v26.yml")
            steps = workflow.fetch("jobs").values.first.fetch("steps")
            step = steps.find { |item| item["name"] == "Create Android project (preserve the existing Terra Serenada bridges)" }
            abort "ERROR: Could not locate the known Android project-generation step in build-apk-v26.yml." unless step && step["run"]
            File.write(ENV.fetch("RUNNER_TEMP") + "/create-android-project.sh", step["run"])
          '
          test -s "$RUNNER_TEMP/create-android-project.sh"
          bash "$RUNNER_TEMP/create-android-project.sh"
          echo "Android project generated in the runner; no repository files were committed or pushed."

      - name: Set monotonically newer application version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          old_code = "versionCode = 1000 + ciRunNumber"
          new_code = "versionCode = 2000 + ciRunNumber"
          old_name = 'versionName = "1.0.21.$ciRunNumber"'
          new_name = 'versionName = "1.0.22.$ciRunNumber"'
          if s.count(old_code) != 1 or s.count(old_name) != 1:
              raise SystemExit("ERROR: Could not safely update the app version in the generated Gradle file.")
          p.write_text(s.replace(old_code, new_code, 1).replace(old_name, new_name, 1), encoding="utf-8")
          print("Application version configured: versionCode 2000 + workflow run number, versionName 1.0.22.<run>.")
          PYTHON

      - name: Bundle native integration sources from the known-good v26 workflow
        shell: bash
        run: |
          set -euo pipefail
          # The repository's standalone patch script is older and uses Kotlin 2.2.x.
          # Extract the exact self-contained integration step from v26, which passed its checks.
          ruby -ryaml -e '
            workflow = YAML.safe_load_file(".github/workflows/build-apk-v26.yml")
            steps = workflow.fetch("jobs").values.first.fetch("steps")
            step = steps.find { |item| item["name"] == "Bundle native integration sources (self-contained v26 workflow)" }
            abort "ERROR: Could not locate the known-good native integration bundle in build-apk-v26.yml." unless step && step["run"]
            File.write(ENV.fetch("RUNNER_TEMP") + "/bundle-native-sources.sh", step["run"])
          '
          test -s "$RUNNER_TEMP/bundle-native-sources.sh"
          bash "$RUNNER_TEMP/bundle-native-sources.sh"
          test -s android-local/NaraLocalEngine.kt
          test -s .github/scripts/patch_nara_android.py
          test -s .github/scripts/patch_nara_local_index.py
          echo "Known-good v26 Kotlin 2.4.21 integration sources are prepared in the runner."

      - name: Integrate Nara LiteRT-LM runtime and native bridge
        shell: bash
        run: |
          set -euo pipefail
          test -s android-local/NaraLocalEngine.kt
          test -s .github/scripts/patch_nara_android.py
          test -s .github/scripts/patch_nara_local_index.py
          python3 .github/scripts/patch_nara_android.py
          python3 -m py_compile .github/scripts/patch_nara_android.py .github/scripts/patch_nara_local_index.py
          test -s android/app/src/main/java/com/terra/serenada/NaraLocalEngine.kt

      - name: Ensure native backup and notification hooks in HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("android/app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          if "AndroidBridge.saveBackup" not in s and "buildBackupJson" not in s:
              raise SystemExit("HTML backup bridge marker not found; refusing to build an incompatible APK.")
          old = "async function requestNotifications(){if(!('Notification' in window)){showToast('Browser ini tidak mendukung notifikasi');return false}const p=await Notification.requestPermission();if(p==='granted'){showToast('Notifikasi diaktifkan');scheduleNotifications();return true}showToast('Izin notifikasi belum diberikan');return false}"
          new = "async function requestNotifications(){if(window.AndroidBridge&&typeof window.AndroidBridge.requestNotifications==='function'){window.AndroidBridge.requestNotifications();showToast('Permintaan izin notifikasi dibuka');scheduleNotifications();return true}if(!('Notification' in window)){showToast('Browser ini tidak mendukung notifikasi');return false}const p=await Notification.requestPermission();if(p==='granted'){showToast('Notifikasi diaktifkan');scheduleNotifications();return true}showToast('Izin notifikasi belum diberikan');return false}"
          if "AndroidBridge.requestNotifications" not in s:
              if old not in s:
                  raise SystemExit("Native notification function not found; cannot connect Android permission bridge safely.")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PYTHON
          python3 .github/scripts/patch_nara_local_index.py android/app/src/main/assets/index.html
          grep -q 'naraNativeModelBtn' android/app/src/main/assets/index.html
          grep -q 'window.__naraSetNativeStatus' android/app/src/main/assets/index.html

      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/terra-serenada-release.p12"
          test -s "$RUNNER_TEMP/terra-serenada-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/terra-serenada-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=terra-serenada" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify Kotlin and LiteRT-LM configuration
        shell: bash
        run: |
          set -euo pipefail
          require_pattern() {
            local pattern="$1" file="$2" description="$3"
            if ! grep -Eq "$pattern" "$file"; then
              echo "ERROR: Verification failed: $description"
              echo "File inspected: $file"
              echo "Relevant configuration follows:"
              grep -n -E 'plugins|kotlin|compilerOptions|jvmTarget|litertlm|versionCode|versionName|RECOMMENDED_MODEL_URL|URL\(' "$file" || true
              exit 1
            fi
            echo "PASS: $description"
          }
          require_pattern 'org\.jetbrains\.kotlin\.android.*2\.4\.21' android/build.gradle.kts 'Kotlin Android plugin version 2.4.21'
          require_pattern 'litertlm-android:0\.18\.0' android/app/build.gradle.kts 'LiteRT-LM dependency version 0.18.0'
          require_pattern 'compilerOptions[[:space:]]*\{' android/app/build.gradle.kts 'typed Kotlin compilerOptions block'
          require_pattern 'JvmTarget\.JVM_17' android/app/build.gradle.kts 'Kotlin JVM target 17'
          if grep -Eq 'kotlinOptions[[:space:]]*\{[[:space:]]*jvmTarget' android/app/build.gradle.kts; then
            echo "ERROR: Legacy kotlinOptions/jvmTarget DSL remains alongside Kotlin 2.4.21."
            grep -n -E 'kotlinOptions|jvmTarget|compilerOptions' android/app/build.gradle.kts || true
            exit 1
          fi
          require_pattern 'URL\(RECOMMENDED_MODEL_URL\)' android/app/src/main/java/com/terra/serenada/NaraLocalEngine.kt 'recommended LiteRT-LM model URL is present'
          require_pattern 'versionCode = 2000 \+ ciRunNumber' android/app/build.gradle.kts 'monotonically increased application versionCode'
          echo "Kotlin, runtime and application version configuration checks passed."

      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for validation
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Terra-Serenada.apk
          test -s Terra-Serenada.apk
          ls -lh Terra-Serenada.apk
          sha256sum Terra-Serenada.apk

      - name: Validate APK archive, signing certificate, metadata and alignment
        shell: bash
        env:
          BASELINE_APK_URL: https://github.com/terra-serenada/Terra-Serenada/releases/download/apk-v1.0.19-10/Terra-Serenada.apk
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$ZIPALIGN" && test -x "$AAPT"
          curl --fail --location --retry 3 --silent --show-error "$BASELINE_APK_URL" --output baseline.apk
          test -s baseline.apk && test -s Terra-Serenada.apk
          unzip -t Terra-Serenada.apk
          "$APKSIGNER" verify --verbose --print-certs baseline.apk 2>&1 | tee baseline-signature.txt
          "$APKSIGNER" verify --verbose --print-certs Terra-Serenada.apk 2>&1 | tee new-signature.txt
          # Android Build Tools may prefix the signer label differently. Parse the stable certificate digest label.
          extract_certificate_sha256() {
            local signature_file="$1"
            awk '/certificate SHA-256 digest:/ { sub(/^.*certificate SHA-256 digest:[[:space:]]*/, ""); print; exit }' "$signature_file" \
              | tr -d ':' \
              | tr -d '[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          }
          baseline_fingerprint="$(extract_certificate_sha256 baseline-signature.txt)"
          new_fingerprint="$(extract_certificate_sha256 new-signature.txt)"
          if [ -z "$baseline_fingerprint" ] || [ -z "$new_fingerprint" ]; then
            echo "ERROR: Unable to extract APK certificate SHA-256 fingerprint. Raw signer details follow:"
            grep -Ei 'certificate DN|certificate SHA-256 digest|Number of signers|Verified using' baseline-signature.txt new-signature.txt || true
            exit 1
          fi
          echo "Known previous APK certificate SHA-256: $baseline_fingerprint"
          echo "New APK certificate SHA-256:            $new_fingerprint"
          if [ "$baseline_fingerprint" != "$new_fingerprint" ]; then
            echo "ERROR: New APK certificate does not match the known older release. Publishing is blocked to protect the installed app and its data."
            exit 1
          fi
          "$ZIPALIGN" -c -v 4 Terra-Serenada.apk
          "$AAPT" dump badging Terra-Serenada.apk | tee apk-metadata.txt
          expected_code=$((2000 + GITHUB_RUN_NUMBER))
          expected_name="1.0.22.${GITHUB_RUN_NUMBER}"
          grep -F "package: name='com.terra.serenada' versionCode='${expected_code}' versionName='${expected_name}'" apk-metadata.txt
          echo "APK package, version, certificate, archive and alignment checks passed."

      - name: Enable KVM permissions for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm is not available on this runner; hardware-accelerated Android emulator tests cannot run reliably."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r Terra-Serenada.apk
            adb logcat -c
            adb shell monkey -p com.terra.serenada -c android.intent.category.LAUNCHER 1
            for attempt in $(seq 1 20); do
              if adb shell pidof com.terra.serenada >/dev/null 2>&1; then break; fi
              sleep 1
            done
            adb shell pidof com.terra.serenada
            if adb logcat -d -s AndroidRuntime:E | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
            echo "APK installed and launched successfully in Android emulator."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Serenada-APK-v1.0.22-${{ github.run_number }}
          path: Terra-Serenada.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.22-${{ github.run_number }}
          name: Terra Serenada APK 1.0.22 (build ${{ github.run_number }})
          body: |
            Terra Serenada APK v27 dengan bridge inferensi lokal Nara berbasis LiteRT-LM.

            Rilis hanya dipublikasikan setelah pemeriksaan arsip APK, metadata paket, tanda tangan digital yang cocok dengan rilis lama, alignment, serta uji pemasangan dan peluncuran di emulator.
            Model .litertlm tetap diimpor satu kali ke penyimpanan privat aplikasi untuk penggunaan offline setelah dimuat.
          files: Terra-Serenada.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
