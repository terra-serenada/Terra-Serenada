name: Diagnose Terra Serenada APK v27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-apk:
    name: Inspect latest Terra Serenada release APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;36.0.0"

      - name: Download latest published APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download --repo "$REPOSITORY" --pattern "Terra-Serenada.apk" --dir .
          test -s Terra-Serenada.apk
          ls -lh Terra-Serenada.apk
          sha256sum Terra-Serenada.apk

      - name: Check APK archive integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Terra-Serenada.apk
          echo "APK archive integrity check passed."

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs Terra-Serenada.apk

      - name: Check alignment and package metadata
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$ZIPALIGN" -c -v 4 Terra-Serenada.apk
          "$AAPT" dump badging Terra-Serenada.apk | tee apk-metadata.txt
          grep -q "package: name='com.terra.serenada'" apk-metadata.txt
          echo "APK structure, signature, alignment, and package metadata checks completed."

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Serenada-APK-v27-diagnostic-report
          path: apk-metadata.txt
          if-no-files-found: ignore
          retention-days: 14
