              const compactValidation=m=>{
                const v=m&&m.validation&&typeof m.validation==='object'?m.validation:{};
                return {status:v.status||'',method:v.method||'',testedAt:v.testedAt||'',failureType:v.failureType||'',summary:String(v.summary||'').slice(0,700),results:Array.isArray(v.results)?v.results.slice(0,3).map(r=>({id:r.id||'',score:Number.isFinite(Number(r.score))?Number(r.score):-1,critical_error:r.critical_error===true,feedback:String(r.feedback||'').slice(0,350)})):[]};
              };
              const entries=[];
              for(const m of Array.isArray(naraState.teacherValidatedLessons)?naraState.teacherValidatedLessons:[]){if(m&&typeof m.text==='string'&&m.validationStatus==='validated'&&m.validation&&m.validation.status==='passed'&&m.validation.method==='nara_three_case_review_v1')entries.push({id:String(m.id||''),fingerprint:naraTeacherLessonFingerprint(m),title:String(m.title||m.topic||'').slice(0,180),topic:String(m.topic||'').slice(0,180),status:'validated',validation:compactValidation(m)});}
              for(const m of Array.isArray(naraState.teacherCandidateLessons)?naraState.teacherCandidateLessons:[]){if(m&&typeof m.text==='string')entries.push({id:String(m.id||''),fingerprint:naraTeacherLessonFingerprint(m),title:String(m.title||m.topic||'').slice(0,180),topic:String(m.topic||'').slice(0,180),status:'candidate',validation:compactValidation(m)});}
              const teacherLearning=naraState.teacherLearning&&typeof naraState.teacherLearning==='object'?naraState.teacherLearning:{};
              const manifest={schema:1,savedAt:new Date().toISOString(),entries:entries.slice(-400),teacherLearning:{enabled:teacherLearning.enabled!==false,foundationCompleted:!!teacherLearning.foundationCompleted,batchCurriculumCompleted:!!teacherLearning.batchCurriculumCompleted,totalUserQuestions:Math.max(0,Number(teacherLearning.totalUserQuestions)||0),lastAutoQuestionCount:Math.max(0,Number(teacherLearning.lastAutoQuestionCount)||0),automaticCycleCount:Math.max(0,Number(teacherLearning.automaticCycleCount)||0),queued:!!teacherLearning.queued,lastAutoLessonAt:teacherLearning.lastAutoLessonAt||null,lastAutoAttemptAt:teacherLearning.lastAutoAttemptAt||null}};
              localStorage.setItem('terra-serenada-nara-teacher-validation-manifest-v1',JSON.stringify(manifest));
            }catch(err){console.warn('Nara validation manifest backup could not be updated:',err);}
          }
          function naraInstallTeacherValidationManifestPersistence(){
            try{
              if(typeof naraPersistState!=='function'||naraPersistState.__naraManifestWrapped)return;
