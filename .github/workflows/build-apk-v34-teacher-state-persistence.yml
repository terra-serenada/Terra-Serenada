              if(!match)continue;
              const restored={...match,validationStatus:'validated',validation:{...(match.validation&&typeof match.validation==='object'?match.validation:{}),status:'passed',method:'nara_three_case_review_v1',testedAt:e.validation.testedAt||match.validation&&match.validation.testedAt||null,summary:e.validation.summary||match.validation&&match.validation.summary||'Status kelulusan dipulihkan dari manifest lokal setelah pembaruan APK.',recoveredFromUpgradeManifest:true}};
              const k=identity(restored);const ix=naraState.teacherValidatedLessons.findIndex(x=>identity(x)===k||naraTeacherLessonFingerprint(x)===naraTeacherLessonFingerprint(restored));
              if(ix>=0)naraState.teacherValidatedLessons[ix]=restored;else naraState.teacherValidatedLessons.push(restored);
            }
            const finalValidFp=new Set(naraState.teacherValidatedLessons.filter(isPassed).map(naraTeacherLessonFingerprint));
            const finalValidIds=new Set(naraState.teacherValidatedLessons.filter(isPassed).map(m=>String(m.id||'')).filter(Boolean));
            naraState.teacherCandidateLessons=naraState.teacherCandidateLessons.filter(m=>!isPassed(m)&&!finalValidIds.has(String(m.id||''))&&!finalValidFp.has(naraTeacherLessonFingerprint(m)));
            naraState.userLessons=naraState.userLessons.filter"""
          if source.count(migration_anchor)!=1:
              raise SystemExit(f'ERROR: expected one migration anchor, found {source.count(migration_anchor)}.')
          source=source.replace(migration_anchor,migration_new,1)

          # Install the manifest writer after normalization has reconstructed the safe stores.
          end_anchor="            naraState.teacherLearning={...old,enabled:old.enabled!==false,foundationCompleted:!!old.foundationCompleted,batchCurriculumCompleted:!!old.batchCurriculumCompleted,totalUserQuestions:Math.max(0,Number(old.totalUserQuestions)||0),lastAutoQuestionCount:Math.max(0,Number(old.lastAutoQuestionCount)||0),automaticCycleCount:Math.max(0,Number(old.automaticCycleCount)||0),queued:!!old.queued,lastAutoLessonAt:old.lastAutoLessonAt||null,lastAutoAttemptAt:old.lastAutoAttemptAt||null};\n          }"
          end_new="            naraState.teacherLearning={...old,enabled:old.enabled!==false,batchCurriculumCompleted:!!old.batchCurriculumCompleted,foundationCompleted:!!old.foundationCompleted,totalUserQuestions:Math.max(0,Number(old.totalUserQuestions)||0),lastAutoQuestionCount:Math.max(0,Number(old.lastAutoQuestionCount)||0),automaticCycleCount:Math.max(0,Number(old.automaticCycleCount)||0),queued:!!old.queued,lastAutoLessonAt:old.lastAutoLessonAt||null,lastAutoAttemptAt:old.lastAutoAttemptAt||null};\n            // Only recover learning-cycle flags when the main saved state does not yet contain them.\n            if(priorManifest&&priorManifest.teacherLearning){const pt=priorManifest.teacherLearning;if(!old||typeof old!=='object'||!('foundationCompleted' in old))naraState.teacherLearning.foundationCompleted=!!pt.foundationCompleted;if(!old||typeof old!=='object'||!('batchCurriculumCompleted' in old))naraState.teacherLearning.batchCurriculumCompleted=!!pt.batchCurriculumCompleted;}\n            naraInstallTeacherValidationManifestPersistence();\n            naraTeacherValidationManifestWrite();\n          }"
          if source.count(end_anchor)!=1:
              raise SystemExit(f'ERROR: expected one normalizer end anchor, found {source.count(end_anchor)}.')
          source=source.replace(end_anchor,end_new,1)

          checks={
            'stable teacher lesson fingerprint exists':'function naraTeacherLessonFingerprint(m)' in source,
            'legacy passed lessons unioned even when validated array exists':'const validatedSeed=[...naraState.teacherValidatedLessons,...oldTeacherLessons.filter(isPassed),...legacyLessons.filter(isPassed)]' in source,
            'validated candidates restore only from explicit passing manifest':'e.status===\'validated\'&&e.validation&&e.validation.status===\'passed\'&&e.validation.method===\'nara_three_case_review_v1\'' in source,
