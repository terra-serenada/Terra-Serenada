      - name: Validate patched HTML and embedded JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path("android/app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I)
          checked = 0
          with tempfile.TemporaryDirectory(prefix="nara-js-check-") as td:
              for i, (attrs, body) in enumerate(blocks):
                  match = re.search(r"type\s*=\s*[\"']?([^\"'\s>]+)", attrs, re.I)
                  if match and match.group(1).lower() not in ("text/javascript", "application/javascript", "module", "text/ecmascript", "application/ecmascript"):
                      continue
                  if not body.strip():
                      continue
                  script = Path(td) / f"script-{i}.js"
                  script.write_text(body, encoding="utf-8")
                  result = subprocess.run(["node", "--check", str(script)], capture_output=True, text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f"ERROR: JavaScript syntax check failed for inline script block {i}.")
                  checked += 1
          if not checked:
              raise SystemExit("ERROR: No inline JavaScript blocks were checked.")
          print(f"PASS: JavaScript syntax valid in {checked} inline script block(s).")
          PYTHON

      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/terra-serenada-release.p12"
          test -s "$RUNNER_TEMP/terra-serenada-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/terra-serenada-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=terra-serenada" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

