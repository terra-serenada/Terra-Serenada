          old_intro='Guru AI mengajarkan kemampuan model bahasa secara otomatis dan menyimpan materinya ke ingatan Nara. Pada tahap awal, Guru menyusun satu paket enam materi fondasi sekaligus dalam satu sesi, jadi kamu tidak perlu menekan tombol untuk tiap materi. Setelah paket tersimpan, Guru dapat menambah pendalaman secara otomatis. Saat online, pertanyaan, cuplikan percakapan, materi belajar yang relevan, dan catatan kebun yang diperlukan dikirim melalui Cloudflare Worker ke Anoman AI. Kunci API tetap berada di Worker. Materi Guru dipakai sebagai konteks, bukan dianggap sebagai fakta kebun terverifikasi. Panel ini bisa dibiarkan tertutup agar halaman Nara tetap ringkas.'
          new_intro='Guru AI mengajarkan kemampuan model bahasa secara otomatis. Materi baru masuk ke antrean kandidat dan belum dipakai dalam retrieval sebelum melewati tiga skenario uji otomatis. Kandidat yang gagal tetap disisihkan; kamu bisa menguji ulang melalui tombol pada daftar materi. Materi yang lolos boleh dipakai sebagai referensi penalaran, tetapi penilaian otomatis bukan jaminan kebenaran mutlak. Materi Guru bukan fakta kebun terverifikasi. Saat online, pertanyaan, konteks percakapan, materi relevan yang tervalidasi, dan catatan kebun yang diperlukan dikirim melalui Cloudflare Worker ke Anoman AI; kunci API tetap di Worker. Panel ini bisa dibiarkan tertutup agar halaman Nara tetap ringkas.'
