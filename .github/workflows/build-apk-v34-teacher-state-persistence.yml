            }catch(err){console.warn('Nara validation manifest persistence wrapper could not be installed:',err);}
          }
          """
          anchor='function naraNormalizeState(){'
          if source.count(anchor)!=1:
              raise SystemExit('ERROR: expected one naraNormalizeState helper insertion anchor.')
          source=source.replace(anchor,helpers+'\n'+anchor,1)

          # Recover already-passed status from all older stores. This intentionally runs even
