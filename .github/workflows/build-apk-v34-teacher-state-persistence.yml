            let priorManifest=null;
            try{priorManifest=JSON.parse(localStorage.getItem('terra-serenada-nara-teacher-validation-manifest-v1')||'null');}catch(_){}
            const priorPassed=Array.isArray(priorManifest&&priorManifest.entries)?priorManifest.entries.filter(e=>e&&e.status==='validated'&&e.validation&&e.validation.status==='passed'&&e.validation.method==='nara_three_case_review_v1'):[];
            const available=[...naraState.teacherValidatedLessons,...naraState.teacherCandidateLessons,...oldTeacherLessons,...legacyLessons].filter(m=>m&&typeof m.text==='string');
            for(const e of priorPassed){
