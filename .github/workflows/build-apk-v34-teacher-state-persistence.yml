          migration_new="""            if(!Array.isArray(naraState.teacherCandidateLessons))naraState.teacherCandidateLessons=oldTeacherLessons.filter(m=>!isPassed(m)).map(m=>({...m,validationStatus:'candidate',validation:m.validation&&m.validation.status==='failed'?m.validation:null}));
            // Union legacy passed records even when the new array already exists but is empty.
            const validatedIdentity=new Set();
