name: Build and publish APK v1.0.24 — Terra Serenada (Nara memory/retrieval Step 2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-apk-v29-memory-retrieval.yml"

permissions:
  contents: write

concurrency:
  group: terra-serenada-apk-release-v29-memory-retrieval
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and validate Nara Step 2 memory/retrieval APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create Android project from the known-good v26 generator (no repository push)
        shell: bash
        run: |
          set -euo pipefail
          # Generate the project in this runner only. Never commit or push from a build job;
          # doing so can race with user uploads and cause non-fast-forward failures.
          ruby -ryaml -e '
            workflow = YAML.safe_load_file(".github/workflows/build-apk-v26.yml")
            steps = workflow.fetch("jobs").values.first.fetch("steps")
            step = steps.find { |item| item["name"] == "Create Android project (preserve the existing Terra Serenada bridges)" }
            abort "ERROR: Could not locate the known Android project-generation step in build-apk-v26.yml." unless step && step["run"]
            File.write(ENV.fetch("RUNNER_TEMP") + "/create-android-project.sh", step["run"])
          '
          test -s "$RUNNER_TEMP/create-android-project.sh"
          bash "$RUNNER_TEMP/create-android-project.sh"
          echo "Android project generated in the runner; no repository files were committed or pushed."

      - name: Set monotonically newer application version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          old_code = "versionCode = 1000 + ciRunNumber"
          new_code = "versionCode = 4000 + ciRunNumber"
          old_name = 'versionName = "1.0.21.$ciRunNumber"'
          new_name = 'versionName = "1.0.24.$ciRunNumber"'
          if s.count(old_code) != 1 or s.count(old_name) != 1:
              raise SystemExit("ERROR: Could not safely update the app version in the generated Gradle file.")
          p.write_text(s.replace(old_code, new_code, 1).replace(old_name, new_name, 1), encoding="utf-8")
          print("Step 2 version configured: versionCode 4000 + workflow run number, versionName 1.0.24.<run>.")
          PYTHON

      - name: Restore previous Nara online-first HTML source
        shell: bash
        run: |
          set -euo pipefail
          # Exact index.html from commit immediately before local LiteRT-LM UI/routing was added.
          # Verify the Git blob hash so a changed or partial download fails closed.
          source_url="https://raw.githubusercontent.com/terra-serenada/Terra-Serenada/15ae13f359645216d509d33c2299c43361f6a854/index.html"
          curl --fail --location --retry 3 --silent --show-error "$source_url" --output android/app/src/main/assets/index.html
          actual_blob="$(git hash-object android/app/src/main/assets/index.html)"
          expected_blob="b7385127cc91e43225a3ed625b732387d8ff4c3f"
          if [ "$actual_blob" != "$expected_blob" ]; then
            echo "ERROR: Historical Nara HTML checksum mismatch. Refusing to build an unverified rollback."
            exit 1
          fi
          grep -q 'async function naraRequestOnlineAnswer' android/app/src/main/assets/index.html
          grep -q "NARA_GURU_MODEL='gpt-4o-mini'" android/app/src/main/assets/index.html
          if grep -q 'naraLocalEnginePanel\|NaraLocalAI\|naraLocalFitMessages' android/app/src/main/assets/index.html; then
            echo "ERROR: Local-engine UI or routing unexpectedly remains in rollback HTML."
            exit 1
          fi
          echo "Previous online-first Nara HTML restored and checksum verified."

      - name: Separate user memory and improve retrieval (Nara Step 2)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          #!/usr/bin/env python3
          """Safely patch the rollback Nara HTML for Step 2: separated memory + weighted retrieval."""
          from pathlib import Path
          import re
          import sys

          path = Path('android/app/src/main/assets/index.html')
          source = path.read_text(encoding='utf-8')
          original = source

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: safe patch stopped at {label}: expected 1 exact anchor, found {count}. No build should continue.')
              source = source.replace(old, new, 1)

          # 1) Upgrade normalization with backward-compatible split storage.
          pattern = r'function naraNormalizeState\(\)\{[\s\S]*?\n\}'
          match = list(re.finditer(pattern, source))
          if len(match) != 1:
              raise SystemExit(f'ERROR: safe patch stopped at naraNormalizeState: expected one function, found {len(match)}.')
          new_normalizer = r'''function naraNormalizeState(){
            if(!naraState||typeof naraState!=='object'||Array.isArray(naraState))naraState={version:3,messages:[],lessons:[],userLessons:[],teacherLessons:[],onlineTeacherLessons:[],teacherLearning:{},updatedAt:''};
            naraState.version=3;
            if(!Array.isArray(naraState.messages))naraState.messages=[];
            if(!Array.isArray(naraState.lessons))naraState.lessons=[];
            const legacyLessons=naraState.lessons.filter(m=>m&&typeof m.text==='string');
            const isTeacherLesson=m=>!!(m&&typeof m==='object'&&(m.learningType==='model_language'||m.origin==='Guru AI Online'||m.sourceTeacherLessonId));
            // Migrate older mixed memory exactly once, keeping explicit user lessons separate from Guru lessons.
            if(!Array.isArray(naraState.userLessons))naraState.userLessons=legacyLessons.filter(m=>!isTeacherLesson(m));
            if(!Array.isArray(naraState.teacherLessons))naraState.teacherLessons=legacyLessons.filter(isTeacherLesson);
            naraState.userLessons=naraState.userLessons.filter(m=>m&&typeof m==='object'&&typeof m.text==='string').slice(-500);
            naraState.teacherLessons=naraState.teacherLessons.filter(m=>m&&typeof m==='object'&&typeof m.text==='string').slice(-200);
            // Keep the legacy combined array for compatibility with older app code and backups.
            naraState.lessons=[...naraState.userLessons,...naraState.teacherLessons].sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))).slice(-700);
            if(!Array.isArray(naraState.onlineTeacherLessons))naraState.onlineTeacherLessons=[];
            naraState.messages=naraState.messages.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.text==='string').slice(-80);
            naraState.onlineTeacherLessons=naraState.onlineTeacherLessons.filter(m=>m&&typeof m==='object'&&typeof m.title==='string').slice(-40);
            const old=naraState.teacherLearning&&typeof naraState.teacherLearning==='object'?naraState.teacherLearning:{};
            naraState.teacherLearning={...old,enabled:old.enabled!==false,foundationCompleted:!!old.foundationCompleted,batchCurriculumCompleted:!!old.batchCurriculumCompleted,totalUserQuestions:Math.max(0,Number(old.totalUserQuestions)||0),lastAutoQuestionCount:Math.max(0,Number(old.lastAutoQuestionCount)||0),automaticCycleCount:Math.max(0,Number(old.automaticCycleCount)||0),queued:!!old.queued,lastAutoLessonAt:old.lastAutoLessonAt||null,lastAutoAttemptAt:old.lastAutoAttemptAt||null};
          }'''
          source = source[:match[0].start()] + new_normalizer + source[match[0].end():]

          # 2) User-facing lesson list now contains only knowledge explicitly taught by the user.
          replace_once("  const list=naraState.lessons.slice().reverse();", "  const list=naraState.userLessons.slice().reverse();", 'user lesson list')
          replace_once("return {plants:data.length,active:active.length,beds:beds.length,inhabitants:inhabitants.length,harvests:harvests.length,gardenNotes:gardenNotes.length,events,waterDue,attention,flowering,upcoming,lessons:naraState.lessons.length};", "return {plants:data.length,active:active.length,beds:beds.length,inhabitants:inhabitants.length,harvests:harvests.length,gardenNotes:gardenNotes.length,events,waterDue,attention,flowering,upcoming,lessons:naraState.userLessons.length};", 'user lesson counter')

          # 3) Replace substring matching with weighted retrieval across separate stores.
          pattern = r'function naraGetTaughtKnowledge\(q\)\{[\s\S]*?\n\}'
          match = list(re.finditer(pattern, source))
          if len(match) != 1:
              raise SystemExit(f'ERROR: safe patch stopped at naraGetTaughtKnowledge: expected one function, found {len(match)}.')
          new_retrieval = r'''function naraMemoryTokens(value){
            return String(value||'').toLocaleLowerCase('id-ID').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
          }
          function naraGetTaughtKnowledge(q){
            naraNormalizeState();
            const stop=new Set(['yang','dengan','untuk','dari','pada','atau','saya','aku','kamu','dia','kami','kita','adalah','bisa','dapat','akan','sudah','belum','saat','ketika','karena','bagaimana','apakah','tolong','ingat','catatan','nara','terra','serenada','tanaman','kebun','tentang','terakhir','kapan','dimana','mengapa','kenapa','berapa','mana','milik','punya','lebih','juga','agar','supaya','dalam','oleh','dari','secara','tersebut','ini','itu','apa','bukan','saja','maka','kalau','jika','atau','setelah','sebelum','masih','telah','bagi','para','setiap']);
            const queryTokens=[...new Set(naraMemoryTokens(q).filter(w=>w.length>=3&&!stop.has(w)))];
            if(!queryTokens.length)return [];
            const sources=[
              ...naraState.userLessons.map(l=>({...l,__memorySource:'Pengetahuan pengguna',__memoryKind:'user_taught'})),
              ...naraState.teacherLessons.map(l=>({...l,__memorySource:'Guru AI Online',__memoryKind:'model_language'}))
            ];
            const aliases={fakta:['faktual','bukti','grounding','terverifikasi'],faktual:['fakta','bukti','grounding','verifikasi'],bukti:['fakta','faktual','grounding','sumber'],grounding:['bukti','fakta','verifikasi','sumber'],dugaan:['asumsi','inferensi','perkiraan'],asumsi:['dugaan','inferensi','perkiraan'],inferensi:['dugaan','asumsi','perkiraan'],perkiraan:['dugaan','asumsi','estimasi'],ingatan:['memori','pengetahuan','pelajaran'],memori:['ingatan','pengetahuan','pelajaran'],retrieval:['pencarian','pengambilan','relevan'],pencarian:['retrieval','pengambilan','relevan'],menguning:['kuning','menguning'],panen:['memanen','pemetikan']};
            const containsTerm=(tokens,term)=>tokens.includes(term)||(term.length>=5&&tokens.some(w=>w.length>=5&&Math.abs(w.length-term.length)<=3&&(w.startsWith(term)||term.startsWith(w))));
            const fieldHit=(tokens,term)=>containsTerm(tokens,term)?1:((aliases[term]||[]).some(alias=>containsTerm(tokens,alias))?0.65:0);
            return sources.map(l=>{
              const titleTokens=naraMemoryTokens(l.title||'');
              const topicTokens=naraMemoryTokens(l.topic||'');
              const summaryTokens=naraMemoryTokens(l.summary||'');
              const textTokens=naraMemoryTokens(l.text||'');
              let score=0,matched=0;
              for(const term of queryTokens){
                const titleHit=fieldHit(titleTokens,term);
                const topicHit=fieldHit(topicTokens,term);
                const summaryHit=fieldHit(summaryTokens,term);
                const textHit=fieldHit(textTokens,term);
                if(titleHit)score+=4.5*titleHit;
                if(topicHit)score+=3.5*topicHit;
                if(summaryHit)score+=2.25*summaryHit;
                if(textHit)score+=1*textHit;
                if(titleHit||topicHit||summaryHit||textHit)matched++;
              }
              const normalizedQuery=naraMemoryTokens(q).join(' ');
              const fullContent=naraMemoryTokens([l.title,l.topic,l.summary,l.text].filter(Boolean).join(' ')).join(' ');
              if(normalizedQuery.length>=8&&fullContent.includes(normalizedQuery))score+=2.5;
              if(queryTokens.length>=2&&matched>=2)score+=Math.min(2,matched*0.25);
              const stamp=Date.parse(l.createdAt||'');
              if(Number.isFinite(stamp))score+=Math.max(0,1-(Date.now()-stamp)/(3650*86400000))*0.08;
              return {...l,score,matchedTerms:matched};
            }).filter(l=>l.score>=1&&l.matchedTerms>0)
              .sort((a,b)=>b.score-a.score||b.matchedTerms-a.matchedTerms||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))
              .slice(0,5);
          }'''
          source = source[:match[0].start()] + new_retrieval + source[match[0].end():]

          # 4) Create concise memory extracts that preserve operating rules and knowledge boundaries.
          anchor = "function naraExpandTaughtContext(question){"
          helper = r'''function naraLessonContextText(lesson,max=900){
            const raw=String(lesson?.text||'').trim();
            if(!raw)return '';
            if(lesson?.__memoryKind==='user_taught'||lesson?.origin==='Pengguna')return naraGuruSafe(raw,max);
            const lines=raw.split(/\n+/).map(x=>x.trim()).filter(Boolean);
            const priority=[/Aturan operasional:/i,/Batas pengetahuan:/i,/Konsep kunci:/i,/Langkah berpikir Nara:/i,/Penerapan:/i,/Pelajaran inti:/i,/Topik:/i,/Bidang pembelajaran:/i,/Pelajaran Guru AI Online:/i,/Materi ajar:/i,/Tujuan belajar:/i];
            const ordered=[];
            for(const pattern of priority){for(const line of lines){if(pattern.test(line)&&!ordered.includes(line))ordered.push(line);}}
            for(const line of lines){if(!ordered.includes(line))ordered.push(line);}
            return naraGuruSafe(ordered.join('\n'),max);
          }
          '''
          if source.count(anchor) != 1:
              raise SystemExit('ERROR: safe patch stopped: naraExpandTaughtContext anchor not found exactly once.')
          source = source.replace(anchor, helper + anchor, 1)

          # 5) User memory commands and teaching writes target their own stores.
          replace_once("const text=learnMatch[1].trim();naraState.lessons.push({id:makeId('nara-lesson'),text,createdAt:new Date().toISOString()});naraState.lessons=naraState.lessons.slice(-100);", "const text=learnMatch[1].trim();naraState.userLessons.push({id:makeId('nara-lesson'),text,createdAt:new Date().toISOString(),origin:'Pengguna',learningType:'user_taught',source:'explicit_memory'});naraPersistState();", 'explicit user memory writer')
          replace_once("naraState.lessons.push(...records.map(x=>x.memory));naraState.lessons=naraState.lessons.slice(-100);", "naraState.teacherLessons.push(...records.map(x=>x.memory));", 'teacher batch writer')
          replace_once("naraState.lessons.push(mem);naraState.lessons=naraState.lessons.slice(-100);", "naraState.teacherLessons.push(mem);", 'teacher adaptive writer')

          # 6) User memory listing returns user-taught items only, never Guru's lessons.
          replace_once("if(!naraState.lessons.length)return 'Belum ada pengetahuan khusus yang kamu ajarkan secara eksplisit. Kirim “Ingat: …” untuk menyimpan pengalaman atau aturan kebun yang ingin kamu ajarkan.';", "if(!naraState.userLessons.length)return 'Belum ada pengetahuan khusus yang kamu ajarkan secara eksplisit. Kirim “Ingat: …” untuk menyimpan pengalaman atau aturan kebun yang ingin kamu ajarkan.';", 'user memory empty state')
          replace_once("return `Pengetahuan yang kamu ajarkan kepadaku (${naraState.lessons.length}):\\n${naraState.lessons.slice(-10).map((l,i)=>`${i+1}. ${l.text}`).join('\\n')}\\n\\nSemua ini disimpan sebagai pengetahuan dari pengguna, bukan fakta yang diverifikasi secara otomatis.`;", "return `Pengetahuan yang kamu ajarkan kepadaku (${naraState.userLessons.length}):\\n${naraState.userLessons.slice(-10).map((l,i)=>`${i+1}. ${l.text}`).join('\\n')}\\n\\nSemua ini disimpan sebagai pengetahuan dari pengguna, bukan fakta yang diverifikasi secara otomatis.`;", 'user memory list output')

          # 7) Only relevant retrieved memories enter online context; do not inject the two newest lessons unconditionally.
          replace_once("  const matched=naraGetTaughtKnowledge(question);\n  const latestModelLessons=naraState.lessons.filter(l=>l.learningType==='model_language'||l.origin==='Guru AI Online').slice(-2).reverse();\n  const lessons=[...new Map([...latestModelLessons,...matched].map(l=>[l.id||l.text,l])).values()].slice(0,4).map(l=>({topik:compact(l.title||l.topic||String(l.text||'').split('\\n')[0],150),asal:l.origin||'Ingatan Nara',materi:compact(l.text,950),jenis:l.learningType||'pengetahuan'}));", "  const matched=naraGetTaughtKnowledge(question);\n  const lessons=matched.slice(0,4).map(l=>({topik:compact(l.title||l.topic||String(l.text||'').split('\\n')[0],150),asal:l.__memorySource||l.origin||'Ingatan Nara',materi:naraLessonContextText(l,950),jenis:l.__memoryKind||l.learningType||'pengetahuan'}));", 'relevant online context')

          # 8) Generic local knowledge and deletion use the separated stores.
          replace_once("  const relevant=naraGetTaughtKnowledge(question);const models=naraState.lessons.filter(l=>l.learningType==='model_language'||l.origin==='Guru AI Online').slice(-2).reverse();\n  return [...new Map([...models,...relevant].map(l=>[l.id||l.text,l])).values()].slice(0,4);", "  return naraGetTaughtKnowledge(question).slice(0,4);", 'local relevant context')
          replace_once("$('pageNara')?.addEventListener('click',e=>{const b=e.target.closest('[data-nara-prompt]');if(b)naraSendMessage(b.dataset.naraPrompt);const del=e.target.closest('[data-nara-lesson-delete]');if(del){const lesson=naraState.lessons.find(x=>x.id===del.dataset.naraLessonDelete);if(lesson&&confirm('Hapus pengetahuan yang diajarkan kepada Nara?')){naraState.lessons=naraState.lessons.filter(x=>x.id!==lesson.id);if(lesson.sourceTeacherLessonId)naraState.onlineTeacherLessons=naraState.onlineTeacherLessons.filter(x=>x.id!==lesson.sourceTeacherLessonId);naraPersistState();naraRefreshOverview();showToast('Pengetahuan Nara dihapus');}}});", "$('pageNara')?.addEventListener('click',e=>{const b=e.target.closest('[data-nara-prompt]');if(b)naraSendMessage(b.dataset.naraPrompt);const del=e.target.closest('[data-nara-lesson-delete]');if(del){const lesson=naraState.userLessons.find(x=>x.id===del.dataset.naraLessonDelete);if(lesson&&confirm('Hapus pengetahuan yang diajarkan kepadamu?')){naraState.userLessons=naraState.userLessons.filter(x=>x.id!==lesson.id);naraPersistState();naraRenderLessons();naraRefreshOverview();showToast('Pengetahuan pengguna dihapus');}}});", 'user memory deletion')

          # Verify the old risky mixed-store operations are gone from writers/readers.
          checks = {
              'split memory arrays': 'naraState.userLessons' in source and 'naraState.teacherLessons' in source,
              'weighted retrieval with topic aliases': 'function naraMemoryTokens' in source and 'matchedTerms' in source and 'const aliases=' in source,
              'operational-rule preservation': 'function naraLessonContextText' in source and 'Aturan operasional:' in source,
              'legacy backup still includes naraState': 'naraState,savedAt' in source and 'incoming.naraState' in source,
              'online answer function remains': 'async function naraRequestOnlineAnswer' in source,
              'online worker/model remains': "NARA_GURU_MODEL='gpt-4o-mini'" in source,
          }
          failed=[name for name,ok in checks.items() if not ok]
          if failed:
              raise SystemExit('ERROR: step-2 post-patch checks failed: '+', '.join(failed))
          if source == original:
              raise SystemExit('ERROR: patch made no changes.')
          path.write_text(source,encoding='utf-8')
          print('Step 2 memory/retrieval patch applied and static checks passed.')
          for name in checks:
              print(f'PASS: {name}')
          PYTHON

      - name: Ensure native backup and notification hooks in HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("android/app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          if "AndroidBridge.saveBackup" not in s and "buildBackupJson" not in s:
              raise SystemExit("HTML backup bridge marker not found; refusing to build an incompatible APK.")
          old = "async function requestNotifications(){if(!('Notification' in window)){showToast('Browser ini tidak mendukung notifikasi');return false}const p=await Notification.requestPermission();if(p==='granted'){showToast('Notifikasi diaktifkan');scheduleNotifications();return true}showToast('Izin notifikasi belum diberikan');return false}"
          new = "async function requestNotifications(){if(window.AndroidBridge&&typeof window.AndroidBridge.requestNotifications==='function'){window.AndroidBridge.requestNotifications();showToast('Permintaan izin notifikasi dibuka');scheduleNotifications();return true}if(!('Notification' in window)){showToast('Browser ini tidak mendukung notifikasi');return false}const p=await Notification.requestPermission();if(p==='granted'){showToast('Notifikasi diaktifkan');scheduleNotifications();return true}showToast('Izin notifikasi belum diberikan');return false}"
          if "AndroidBridge.requestNotifications" not in s:
              if old not in s:
                  raise SystemExit("Native notification function not found; cannot connect Android permission bridge safely.")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PYTHON
      - name: Prepare permanent signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: GitHub Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/terra-serenada-release.p12"
          test -s "$RUNNER_TEMP/terra-serenada-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/terra-serenada-release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=terra-serenada" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify Nara memory Step 2 and online-first configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 4000 + ciRunNumber' android/app/build.gradle.kts
          grep -q 'versionName = "1.0.24.$ciRunNumber"' android/app/build.gradle.kts
          grep -q 'async function naraRequestOnlineAnswer' android/app/src/main/assets/index.html
          grep -q "NARA_GURU_MODEL='gpt-4o-mini'" android/app/src/main/assets/index.html
          if grep -R -E 'com\.google\.ai\.edge\.litertlm|NaraLocalEngine|NaraLocalAI' android/app/src/main android/app/build.gradle.kts; then
            echo "ERROR: LiteRT-LM native runtime or bridge unexpectedly exists in the rollback APK source."
            exit 1
          fi
          grep -q 'function naraMemoryTokens' android/app/src/main/assets/index.html
          grep -q 'function naraLessonContextText' android/app/src/main/assets/index.html
          grep -q 'naraState.userLessons' android/app/src/main/assets/index.html
          grep -q 'naraState.teacherLessons' android/app/src/main/assets/index.html
          if grep -q 'const latestModelLessons=naraState.lessons' android/app/src/main/assets/index.html; then echo "ERROR: Old unconditional newest-lessons injection remains."; exit 1; fi
          echo "Step 2 checks passed: split memory, weighted retrieval, relevant-context selection, online-first Nara route, and no native LiteRT-LM runtime."

      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for validation
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Terra-Serenada.apk
          test -s Terra-Serenada.apk
          ls -lh Terra-Serenada.apk
          sha256sum Terra-Serenada.apk

      - name: Validate APK archive, signing certificate, metadata and alignment
        shell: bash
        env:
          BASELINE_APK_URL: https://github.com/terra-serenada/Terra-Serenada/releases/download/apk-v1.0.19-10/Terra-Serenada.apk
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER" && test -x "$ZIPALIGN" && test -x "$AAPT"
          curl --fail --location --retry 3 --silent --show-error "$BASELINE_APK_URL" --output baseline.apk
          test -s baseline.apk && test -s Terra-Serenada.apk
          unzip -t Terra-Serenada.apk
          "$APKSIGNER" verify --verbose --print-certs baseline.apk 2>&1 | tee baseline-signature.txt
          "$APKSIGNER" verify --verbose --print-certs Terra-Serenada.apk 2>&1 | tee new-signature.txt
          # Android Build Tools may prefix the signer label differently. Parse the stable certificate digest label.
          extract_certificate_sha256() {
            local signature_file="$1"
            awk '/certificate SHA-256 digest:/ { sub(/^.*certificate SHA-256 digest:[[:space:]]*/, ""); print; exit }' "$signature_file" \
              | tr -d ':' \
              | tr -d '[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          }
          baseline_fingerprint="$(extract_certificate_sha256 baseline-signature.txt)"
          new_fingerprint="$(extract_certificate_sha256 new-signature.txt)"
          if [ -z "$baseline_fingerprint" ] || [ -z "$new_fingerprint" ]; then
            echo "ERROR: Unable to extract APK certificate SHA-256 fingerprint. Raw signer details follow:"
            grep -Ei 'certificate DN|certificate SHA-256 digest|Number of signers|Verified using' baseline-signature.txt new-signature.txt || true
            exit 1
          fi
          echo "Known previous APK certificate SHA-256: $baseline_fingerprint"
          echo "New APK certificate SHA-256:            $new_fingerprint"
          if [ "$baseline_fingerprint" != "$new_fingerprint" ]; then
            echo "ERROR: New APK certificate does not match the known older release. Publishing is blocked to protect the installed app and its data."
            exit 1
          fi
          "$ZIPALIGN" -c -v 4 Terra-Serenada.apk
          "$AAPT" dump badging Terra-Serenada.apk | tee apk-metadata.txt
          expected_code=$((4000 + GITHUB_RUN_NUMBER))
          expected_name="1.0.24.${GITHUB_RUN_NUMBER}"
          grep -F "package: name='com.terra.serenada' versionCode='${expected_code}' versionName='${expected_name}'" apk-metadata.txt
          echo "APK package, version, certificate, archive and alignment checks passed."

      - name: Enable KVM permissions for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm is not available on this runner; hardware-accelerated Android emulator tests cannot run reliably."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Android emulator install and launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # IMPORTANT: keep this script as ONE folded command because android-emulator-runner
          # invokes each newline-separated script line through /usr/bin/sh -c. The entire
          # test is delegated to a single Bash process so loops/conditionals stay intact.
          script: >-
            bash -c 'set -euo pipefail; adb wait-for-device; adb install -r Terra-Serenada.apk; adb logcat -c; adb shell monkey -p com.terra.serenada -c android.intent.category.LAUNCHER 1; app_pid=""; for attempt in $(seq 1 30); do app_pid="$(adb shell pidof com.terra.serenada 2>/dev/null || true)"; if [ -n "$app_pid" ]; then break; fi; sleep 1; done; if [ -z "$app_pid" ]; then echo "ERROR: Terra Serenada did not remain running after launch. Android runtime logs follow:"; adb logcat -d -s AndroidRuntime:E ActivityManager:E || true; exit 1; fi; crash_log="$(adb logcat -d -s AndroidRuntime:E 2>&1)" || { echo "ERROR: Unable to read Android runtime logs after launching the app."; exit 1; }; if printf "%s\n" "$crash_log" | grep -q "FATAL EXCEPTION"; then printf "%s\n" "$crash_log"; exit 1; fi; echo "APK installed and app process remained running in Android emulator."'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terra-Serenada-APK-v1.0.24-memory-retrieval-${{ github.run_number }}
          path: Terra-Serenada.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.24-memory-retrieval-${{ github.run_number }}
          name: Terra Serenada APK 1.0.24 — Nara memory/retrieval Step 2 (build ${{ github.run_number }})
          body: |
            Implementasi Nara Step 2 pada dasar APK online-first yang sudah dikenal: memisahkan ingatan yang diajarkan pengguna dan materi Guru AI Online, memigrasikan memori lama secara kompatibel, meningkatkan retrieval dengan pencocokan berbobot atas judul/topik/ringkasan/isi, dan mengirim hanya materi yang relevan ke konteks jawaban. Ringkasan materi Guru memprioritaskan aturan operasional dan batas pengetahuan agar tidak mudah terpotong. Model tetap menggunakan jalur online gpt-4o-mini; tidak ada runtime LiteRT-LM lokal.

            Memori pengguna dan materi Guru tersimpan terpisah dalam naraState, yang tetap disertakan dalam backup JSON. Data lama dimigrasikan saat aplikasi membaca memori tanpa mengganti kunci penyimpanan Nara. Batas penyimpanan baru: hingga 500 materi pengguna dan 200 materi Guru. Materi pengguna yang sebelumnya sudah terhapus dari batas historis 100 catatan tidak dapat dipulihkan oleh migrasi.

            Application ID dan signing certificate dipertahankan. versionCode dinaikkan agar APK dapat dipasang sebagai pembaruan tanpa uninstall. Build berhenti jika patch atau pemeriksaan kode tidak cocok. Rilis hanya dipublikasikan setelah pemeriksaan arsip APK, metadata paket, fingerprint tanda tangan digital, alignment, serta uji instalasi dan peluncuran emulator.
          files: Terra-Serenada.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
